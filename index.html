<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>어디살까? 자취하기 좋은 동네!</title>
    <meta
      name="description"
      content="직접 다녀보고 추천하는 자취 동네 지도. 동네를 누르면 교통·시세·분위기까지 한눈에 확인할 수 있습니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="어디살까? 자취하기 좋은 동네!" />
    <meta
      property="og:description"
      content="직접 다녀보고 추천하는 자취 동네"
    />
    <meta
      property="og:image"
      content="https://odilive.github.io/odilive/og-image.png?v=2"
    />
    <meta property="og:url" content="https://odilive.github.io/odilive/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&family=S-Core+Dream:wght@900&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "PyeongChangPeace-Bold";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/PyeongChangPeace-Bold.woff2")
          format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --brand-teal: #085e6a;
        --brand-teal-dark: #06474f;
        --brand-teal-tint: #eaf4f3;
        --ink: #16282b;
        --ink-soft: #4c6467;
        --line: #dbe6e5;
      }

      body {
        margin: 0;
        padding: 12px 20px 20px;
        background-color: #f2f6f6;
        color: var(--ink);
        height: 100vh;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }

      body,
      button,
      input,
      select,
      textarea {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 6px;
        padding: 4px 4px;
        flex-shrink: 0;
      }
      .header-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-wordmark {
        margin: 0;
        font-size: 26px;
        font-family: "PyeongChangPeace-Bold", sans-serif;
        font-weight: 700;
        color: var(--brand-teal);
        letter-spacing: -0.01em;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
      }
      .site-menu-btn {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--brand-teal-dark);
        font-size: 21px;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(8, 94, 106, 0.1);
      }
      .site-menu-btn:hover,
      .site-menu-btn[aria-expanded="true"] {
        background: var(--brand-teal-tint);
        border-color: var(--brand-teal);
      }
      .site-menu {
        display: none;
        position: absolute;
        top: 46px;
        right: 0;
        width: 220px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 28px rgba(8, 94, 106, 0.2);
        z-index: 30;
      }
      .site-menu.open {
        display: block;
      }
      .site-menu-item {
        display: flex;
        align-items: center;
        width: 100%;
        box-sizing: border-box;
        padding: 11px 12px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
      }
      .site-menu-item:hover {
        background: var(--brand-teal-tint);
        color: var(--brand-teal-dark);
      }
      .site-menu-item.is-soon {
        color: #8a9a9b;
        cursor: default;
      }
      .site-menu-item small {
        margin-left: auto;
        font-size: 10px;
        font-weight: 700;
        color: #9aa7a8;
      }

      #map-controls {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 10;
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 8px;
      }

      .ctrl-wrap {
        position: relative;
      }

      .ctrl-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: inherit;
        font-size: 13px;
        font-weight: bold;
        padding: 7px 14px;
        border-radius: 20px;
        border: 2px solid var(--brand-teal);
        color: var(--brand-teal-dark);
        background: #fff;
        cursor: pointer;
        box-shadow: 0 2px 10px rgba(8, 94, 106, 0.2);
        transition:
          background 0.15s ease,
          color 0.15s ease,
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .ctrl-btn:hover {
        background: var(--brand-teal-tint);
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(8, 94, 106, 0.3);
      }
      .ctrl-btn.is-active,
      .ctrl-btn.is-active:hover {
        background: var(--brand-teal-dark);
        border-color: var(--brand-teal-dark);
        color: #fff;
        box-shadow:
          0 0 0 2px #fff inset,
          0 4px 14px rgba(8, 94, 106, 0.5);
      }
      .ctrl-caret {
        font-size: 9px;
        opacity: 0.85;
      }

      .ctrl-panel {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        margin-top: 8px;
        background: #fff;
        border-radius: 12px;
        padding: 8px;
        box-shadow: 0 8px 24px rgba(8, 94, 106, 0.25);
        flex-direction: column;
        gap: 3px;
        min-width: 160px;
        z-index: 20;
      }
      .ctrl-panel.open {
        display: flex;
      }
      .ctrl-option {
        font-family: inherit;
        text-align: left;
        padding: 9px 10px;
        border: none;
        background: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .ctrl-option:hover {
        background: var(--brand-teal-tint);
        color: var(--brand-teal-dark);
      }

      #map-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #map {
        width: 100%;
        height: 100%;
        border-radius: 14px;
        border: 1px solid var(--line);
        box-sizing: border-box;
        box-shadow: 0 4px 16px rgba(8, 94, 106, 0.12);
      }
      .poly-hover {
        cursor: pointer !important;
      }

      /* 상세 정보 패널 (PC: 오른쪽 슬라이드, 모바일: 하단 바텀시트) */
      #info-panel {
        position: fixed;
        top: 0;
        right: -400px;
        width: 390px;
        height: 100vh;
        background: white;
        z-index: 9999;
        padding: 32px 28px 20px;
        box-shadow: -5px 0 24px rgba(8, 94, 106, 0.16);
        transition: 0.3s ease-out;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      #info-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      #info-panel.open {
        right: 0;
      }
      #info-panel h3 {
        margin: 0 0 6px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--brand-teal-dark);
      }
      #info-tagline {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--brand-teal);
        margin-bottom: 16px;
      }
      #info-tagline:empty {
        display: none;
      }
      #info-desc {
        margin-bottom: 16px;
      }
      #info-desc .desc-heading {
        font-size: 13px;
        font-weight: 800;
        color: var(--brand-teal-dark);
        margin: 12px 0 3px;
      }
      #info-desc .desc-heading:first-child {
        margin-top: 0;
      }
      #info-desc .desc-line {
        font-size: 14px;
        color: var(--ink-soft);
        line-height: 1.7;
      }
      #info-specs {
        margin-bottom: 16px;
      }
      #info-specs div {
        display: flex;
        gap: 10px;
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 3px;
      }
      #info-specs .spec-label {
        flex-shrink: 0;
        width: 28px;
        font-weight: bold;
        color: var(--brand-teal);
      }
      #info-specs .spec-text {
        color: var(--ink-soft);
      }
      .spec-info-btn {
        border: 1.5px solid var(--ink-soft);
        background: none;
        padding: 0;
        margin: 0;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        font-size: 10px;
        font-weight: bold;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--ink-soft);
        flex-shrink: 0;
      }
      #info-specs .spec-info-tooltip {
        display: none;
        position: fixed;
        box-sizing: border-box;
        width: 300px;
        max-width: calc(100vw - 16px);
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--ink-soft);
        word-break: keep-all;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        z-index: 10000;
      }
      #info-specs .spec-info-tooltip.open {
        display: block;
      }
      .dev-stage-danger {
        color: #c76a15;
        font-weight: 800;
      }
      #info-specs .spec-info-note {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        color: #9aa7a8;
      }
      #info-links {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-shrink: 0;
      }
      #info-links:empty {
        display: none;
      }
      #info-links a {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: bold;
        text-decoration: none;
      }
      #info-links a svg {
        flex-shrink: 0;
      }
      #info-links .link-youtube {
        background: #fdeaea;
        color: #c0392b;
      }
      #info-links .link-blog {
        background: #e7f7ee;
        color: #059e4a;
      }
      #info-facts {
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      #info-facts.is-empty {
        display: none;
      }
      #info-amenities {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      #info-amenities:empty {
        display: none;
      }
      #info-amenities span {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: bold;
        white-space: nowrap;
      }
      #info-amenities .grade-O {
        background: var(--brand-teal-tint);
        color: var(--brand-teal-dark);
      }
      #info-amenities .grade-X {
        background: #eef1f1;
        color: #8a9a9b;
      }
      #info-facility-summary {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      #info-facility-summary span {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: bold;
        white-space: nowrap;
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink-soft);
      }
      #info-facility-summary span.count-zero {
        border-color: #eceff0;
        color: #b7c2c3;
      }
      #info-panel p {
        white-space: pre-wrap;
        line-height: 1.7;
        color: var(--ink-soft);
        font-size: 14px;
      }
      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #93a5a6;
      }
      .copy-btn {
        position: absolute;
        top: 24px;
        right: 54px;
        background: none;
        border: none;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #93a5a6;
        cursor: pointer;
      }

      /* 메뉴에서 여는 Story·동네 목록 패널 */
      #site-panel {
        position: fixed;
        top: 0;
        right: -400px;
        width: 390px;
        height: 100vh;
        padding: 32px 28px 24px;
        box-sizing: border-box;
        background: #fff;
        box-shadow: -5px 0 24px rgba(8, 94, 106, 0.16);
        transition: right 0.3s ease-out;
        z-index: 9998;
      }
      #site-panel.open {
        right: 0;
      }
      #site-panel-scroll {
        height: 100%;
        overflow-y: auto;
        padding-right: 2px;
      }
      .panel-eyebrow {
        margin: 0 0 8px;
        color: var(--brand-teal);
        font-size: 12px;
        font-weight: 800;
      }
      .panel-title {
        margin: 0 36px 16px 0;
        color: var(--brand-teal-dark);
        font-size: 23px;
        line-height: 1.35;
        letter-spacing: -0.03em;
      }
      .panel-copy {
        margin: 0 0 14px;
        color: var(--ink-soft);
        font-size: 14px;
        line-height: 1.75;
        word-break: keep-all;
      }
      .panel-note {
        margin-top: 22px;
        padding: 14px;
        border-radius: 12px;
        background: var(--brand-teal-tint);
        color: var(--brand-teal-dark);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.6;
      }
      .neighborhood-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .neighborhood-list-item {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .neighborhood-list-item:hover {
        border-color: var(--brand-teal);
        background: var(--brand-teal-tint);
      }
      .neighborhood-list-item strong,
      .neighborhood-list-item span {
        display: block;
      }
      .neighborhood-list-item strong {
        color: var(--brand-teal-dark);
        font-size: 14px;
      }
      .neighborhood-list-item span {
        margin-top: 4px;
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.45;
      }
      .map-guide {
        position: absolute;
        top: 68px;
        left: 50%;
        max-width: 300px;
        padding: 11px 38px 11px 13px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 4px 16px rgba(8, 94, 106, 0.16);
        color: var(--ink-soft);
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.55;
        transform: translateX(-50%);
        z-index: 11;
      }
      .map-guide strong {
        color: var(--brand-teal-dark);
      }
      .map-guide-close {
        position: absolute;
        top: 7px;
        right: 8px;
        border: 0;
        background: transparent;
        color: #93a5a6;
        font-size: 19px;
        cursor: pointer;
      }
      .sheet-handle {
        display: none;
      }

      @media (max-width: 600px) {
        body {
          padding: 8px 10px 10px;
        }
        #info-panel {
          top: auto;
          right: 0;
          bottom: -100%;
          width: 100%;
          height: auto;
          max-height: 60vh;
          border-radius: 16px 16px 0 0;
          box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.2);
        }
        #info-panel.open {
          bottom: 0;
        }
        #site-panel {
          top: auto;
          right: 0;
          bottom: -100%;
          width: 100%;
          height: auto;
          max-height: 72vh;
          padding: 30px 22px 22px;
          border-radius: 16px 16px 0 0;
          box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.2);
          transition: bottom 0.3s ease-out;
        }
        #site-panel.open {
          right: 0;
          bottom: 0;
        }
        .sheet-handle {
          display: block;
          position: absolute;
          top: 10px;
          left: 50%;
          width: 36px;
          height: 4px;
          border-radius: 99px;
          background: #c7d3d4;
          transform: translateX(-50%);
          touch-action: none;
          cursor: grab;
        }
        body {
          overscroll-behavior-y: none;
        }
        #info-scroll,
        #site-panel-scroll {
          overscroll-behavior-y: contain;
        }
        .map-guide {
          top: 66px;
          left: 50%;
          width: calc(100% - 24px);
          max-width: 360px;
          padding-right: 38px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-brand">
        <img
          src="logo.png"
          alt="어디살까 로고"
          style="height: 42px; width: auto"
        />
        <p class="header-wordmark">어디살까</p>
      </div>
      <div class="header-actions">
        <button
          class="site-menu-btn"
          id="site-menu-btn"
          type="button"
          aria-label="메뉴 열기"
          aria-expanded="false"
          onclick="toggleSiteMenu()"
        >
          ☰
        </button>
        <nav class="site-menu" id="site-menu" aria-label="사이트 메뉴">
          <button class="site-menu-item" type="button" onclick="openStoryPanel()">
            ✦ 어디살까 이야기
          </button>
          <button class="site-menu-item" type="button" onclick="openNeighborhoodList()">
            🗺️ 동네 둘러보기
          </button>
          <span class="site-menu-item is-soon" aria-disabled="true">
            ▶ 영상으로 보기 <small>준비 중</small>
          </span>
          <span class="site-menu-item is-soon" aria-disabled="true">
            ✎ 글로 자세히 보기 <small>준비 중</small>
          </span>
          <span class="site-menu-item is-soon" aria-disabled="true">
            ✉ 동네 제보·의견 보내기 <small>준비 중</small>
          </span>
        </nav>
      </div>
    </div>

      <div id="map-wrap">
        <div id="map"></div>
      <div id="map-controls">
        <div class="ctrl-wrap">
          <button
            class="ctrl-btn"
            id="theme-toggle-btn"
            onclick="toggleThemePanel()"
          >
            <span id="theme-btn-label">🧭 테마 지도</span>
            <span class="ctrl-caret">▾</span>
          </button>
          <div class="ctrl-panel" id="theme-panel">
            <button class="ctrl-option" onclick="selectTheme('')">
              🧭 테마 없음
            </button>
            <button class="ctrl-option" onclick="selectTheme('혼밥')">
              🍚 혼밥 지도
            </button>
            <button class="ctrl-option" onclick="selectTheme('공부')">
              ✏️ 공부 지도
            </button>
            <button class="ctrl-option" onclick="selectTheme('산책')">
              🚶 산책 지도
          </button>
        </div>
      </div>
        <button
          class="ctrl-btn"
          id="brand-toggle-btn"
          onclick="toggleAllBrands()"
        >
          <span>⭐ 자취 인프라</span>
        </button>
      </div>
      <div class="map-guide" id="map-guide">
        <strong>어디부터 볼까요?</strong><br />
        역 이름을 눌러 추천 동네를 펼쳐보고, 동네를 누르면 실제 답사 정보를 확인해보세요.
        <button
          class="map-guide-close"
          type="button"
          aria-label="안내 닫기"
          onclick="closeMapGuide()"
        >
          ×
        </button>
      </div>
    </div>

      <div id="info-panel">
        <div class="sheet-handle" aria-hidden="true"></div>
      <button class="close-btn" onclick="closeInfoPanel()">&times;</button>
      <button
        class="copy-btn"
        id="btn-copy-link"
        onclick="copyNeighborhoodLink()"
        title="이 동네 링크 복사"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
          ></path>

      function enableMobileSheetDrag(panelId, scrollId, closePanel) {
        var panel = document.getElementById(panelId);
        var scroll = document.getElementById(scrollId);
        var startY = null;
        var distance = 0;
        var isDraggingSheet = false;

        panel.addEventListener("touchstart", function (e) {
          if (!window.matchMedia("(max-width: 600px)").matches) return;
          if (e.target.closest("button, a")) return;

          var panelTop = panel.getBoundingClientRect().top;
          var touchedTopArea = e.touches[0].clientY - panelTop < 88;
          var contentIsAtTop = scroll.scrollTop <= 0;
          if (!touchedTopArea && !contentIsAtTop) return;

          startY = e.touches[0].clientY;
          distance = 0;
          isDraggingSheet = true;
        });

        panel.addEventListener(
          "touchmove",
          function (e) {
            if (!isDraggingSheet || startY === null) return;
            var rawDistance = e.touches[0].clientY - startY;
            if (rawDistance <= 0) {
              isDraggingSheet = false;
              startY = null;
              return;
            }
            distance = rawDistance;
            panel.style.transition = "none";
            panel.style.transform = "translateY(" + distance + "px)";
            if (e.cancelable) e.preventDefault();
          },
          { passive: false },
        );

        function finishSheetDrag() {
          if (!isDraggingSheet || startY === null) return;
          panel.style.transition = "";
          panel.style.transform = "";
          if (distance > 90) closePanel();
          startY = null;
          distance = 0;
          isDraggingSheet = false;
        }

        panel.addEventListener("touchend", finishSheetDrag);
        panel.addEventListener("touchcancel", finishSheetDrag);
      }

      function renderDescription(text) {
        function esc(s) {
          return s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }
        return (text || "")
          .split("\n")
          .map(function (line) {
            var m = line.match(/^\[(.+?)\]\s*(.*)$/);
            if (m) {
              return (
                '<div class="desc-heading">' +
                esc(m[1]) +
                "</div>" +
                (m[2] ? '<div class="desc-line">' + esc(m[2]) + "</div>" : "")
              );
            }
            if (line.trim() === "") return "";
            return '<div class="desc-line">' + esc(line) + "</div>";
          })
          .join("");

          links +=
            '<a class="link-blog" href="' +
            row.blog_url +
            '" target="_blank">' +
            NAVER_ICON +
            " 소개글 전문</a>";
        document.getElementById("info-links").innerHTML = links;

        document.getElementById("info-panel").classList.add("open");
        renderCachedFacilities(row.facilities || []);
        if (bounds) renderNearbyBrandMarkers(bounds);
      }

      // 폴리곤 바운딩박스를 상하좌우로 meters만큼 넓힘 (경계 기준 버퍼)
      function padBounds(bounds, meters) {
        var sw = bounds.getSouthWest();
        var ne = bounds.getNorthEast();
        var avgLat = ((sw.getLat() + ne.getLat()) / 2) * (Math.PI / 180);
        var latPad = meters / 111000;
        var lngPad = meters / (111000 * Math.cos(avgLat));
        return new kakao.maps.LatLngBounds(
          new kakao.maps.LatLng(sw.getLat() - latPad, sw.getLng() - lngPad),
          new kakao.maps.LatLng(ne.getLat() + latPad, ne.getLng() + lngPad),
        );
      }

      // 동네 상세정보를 열 때, 그 동네 경계에서 500m 이내의 자취인프라(다이소·올리브영·스벅·대형슈퍼)를
      // 자취인프라 토글 상태와 무관하게 정확한 위치 참고용으로 같이 보여줌
      var BRAND_NEARBY_BUFFER_METERS = 500;
      var nearbyBrandMarkers = {}; // 상세정보에서 보여준 브랜드별 마커 (토글이 나중에 켜지면 정리용)

      function clearNearbyBrandMarkers(brand) {
        (nearbyBrandMarkers[brand] || []).forEach(function (marker) {
          marker.setMap(null);
        });
        nearbyBrandMarkers[brand] = [];
      }

      function renderNearbyBrandMarkers(bounds) {
        bounds = padBounds(bounds, BRAND_NEARBY_BUFFER_METERS);
        Object.keys(brandData).forEach(function (brand) {
          // 자취인프라 토글이 이미 켜진 브랜드는 그쪽 검색이 알아서 보여주니 중복 검색 생략
          if (brandData[brand].active) return;
          nearbyBrandMarkers[brand] = nearbyBrandMarkers[brand] || [];
          var icon = brandData[brand].icon;
          var handleResults = function (data, status) {
            if (status !== kakao.maps.services.Status.OK) return;
            data.forEach(function (place) {
              var marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(place.y, place.x),
                image: new kakao.maps.MarkerImage(
                  icon,
                  new kakao.maps.Size(30, 30),
                ),
                map: map,
                zIndex: 40,
              });
              kakao.maps.event.addListener(marker, "click", function () {
                if (place.place_url) window.open(place.place_url, "_blank");
              });
              subMarkers.push(marker);
              nearbyBrandMarkers[brand].push(marker);
            });
          };
          brandData[brand].keywords.forEach(function (keyword) {
            ps.keywordSearch(keyword, handleResults, { bounds: bounds });
          });
          (brandData[brand].categories || []).forEach(function (code) {
            ps.categorySearch(code, handleResults, { bounds: bounds });
          });
        });
      }

      var selectedNeighborhood = null; // 지금 폴리곤이 펼쳐져 보이는 동네 (한 번에 하나만)

      var NAME_LABEL_STYLE =
        "background:white; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; color:#06474f; box-shadow:0 2px 6px rgba(8,94,106,0.3); white-space:nowrap; cursor:pointer; border:1.5px solid #085e6a;";
      var NAME_LABEL_STYLE_SELECTED =
        "background:#06474f; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; color:#fff; box-shadow:0 0 0 2px #fff inset, 0 3px 10px rgba(8,94,106,0.5); white-space:nowrap; cursor:pointer; border:1.5px solid #06474f;";
      var NAME_LABEL_STYLE_DEV =
        "background:#fdf0e3; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; color:#c76a15; box-shadow:0 2px 6px rgba(199,106,21,0.3); white-space:nowrap; cursor:pointer; border:1.5px solid #c76a15;";
      var NAME_LABEL_STYLE_DEV_SELECTED =
        "background:#c76a15; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; color:#fff; box-shadow:0 0 0 2px #fff inset, 0 3px 10px rgba(199,106,21,0.5); white-space:nowrap; cursor:pointer; border:1.5px solid #c76a15;";

      function isDevHighlighted(row) {
        return !!(
          row &&
          row.development &&
          row.development_highlight !== false
        );
      }

      function labelStyleFor(n, selected) {
        var isDev = isDevHighlighted(n.row);
        if (selected)
          return isDev
            ? NAME_LABEL_STYLE_DEV_SELECTED
            : NAME_LABEL_STYLE_SELECTED;
        return isDev ? NAME_LABEL_STYLE_DEV : NAME_LABEL_STYLE;
      }

      function closeInfoPanel() {
        clearSubMarkers();
        document.getElementById("info-panel").classList.remove("open");
        if (selectedNeighborhood) {
          selectedNeighborhood.polygon.setMap(null);
          selectedNeighborhood.labelEl.style.cssText = labelStyleFor(
            selectedNeighborhood,
            false,
          );
          selectedNeighborhood = null;
        }
      }

      // 이름표를 클릭했을 때: 그 동네만 폴리곤을 펼치고, 이전에 펼쳐져 있던 폴리곤은 접음
      function selectNeighborhood(n) {
        closeMapGuide();
        if (selectedNeighborhood && selectedNeighborhood !== n) {
          selectedNeighborhood.polygon.setMap(null);
          selectedNeighborhood.labelEl.style.cssText = labelStyleFor(
            selectedNeighborhood,
            false,
          );
        }
        selectedNeighborhood = n;
        n.polygon.setMap(map);
        n.labelEl.style.cssText = labelStyleFor(n, true);
        isPolygonClicked = true;
        setTimeout(function () {
          isPolygonClicked = false;
        }, 100);
        openInfoPanel(n.row, n.bounds);
      }

      var stationGroups = [];

      function boundsCenter(b) {
        var sw = b.getSouthWest();
        var ne = b.getNorthEast();
        return new kakao.maps.LatLng(
          (sw.getLat() + ne.getLat()) / 2,
          (sw.getLng() + ne.getLng()) / 2,
        );
      }

      // 현재 줌 레벨에 따라 "이름표들" ↔ "역 단위 그룹 라벨"을 전환 (폴리곤 자체는 선택했을 때만 보임)
      function updateNeighborhoodVisibility() {
        var showIndividual = map.getLevel() <= NEIGHBORHOOD_ZOOM_THRESHOLD;
        neighborhoods.forEach(function (n) {
          n.nameLabel.setMap(showIndividual ? map : null);
        });
        stationGroups.forEach(function (g) {
          g.marker.setMap(showIndividual ? null : map);
        });
        // 역단위로 축소된 상태에서는 큐레이션 핀·자취인프라 마커도 같이 숨겨서 소음을 줄임
        closeThemeCard();
        themePins.forEach(function (p) {
          p.setMap(showIndividual ? map : null);
        });
        updateBrandMarkerVisibility();
        // 이 줌에서는 기능 자체가 무의미하니 버튼도 같이 숨김 (눌러도 반응 없어 보이는 것 방지)
        document.querySelector(".ctrl-wrap").style.display = showIndividual
          ? ""
          : "none";
        document.getElementById("brand-toggle-btn").style.display =
          showIndividual ? "" : "none";
        if (!showIndividual) {
          closeInfoPanel(); // 축소되면 선택 해제 + 펼쳐진 폴리곤·이모지·패널 정리
        }
      }

      function updateBrandMarkerVisibility() {
        var showIndividual = map.getLevel() <= NEIGHBORHOOD_ZOOM_THRESHOLD;
        Object.keys(brandData).forEach(function (brand) {
          var state = brandData[brand];
          Object.values(state.markers).forEach(function (marker) {
            marker.setMap(state.active && showIndividual ? map : null);
          });
        });
      }

      // 같은 역(row.station) 기준으로 동네들을 묶어서, 축소 상태에서 역당 라벨 하나만 표시
      function buildStationGroups() {
        stationGroups.forEach(function (g) {
          g.marker.setMap(null);
        });
        stationGroups = [];

        var groupsByKey = {};
        neighborhoods.forEach(function (n) {
          var stationName = n.row.station && n.row.station.trim();
          if (!stationName) return; // 역 미입력 동네는 축소 상태에서 표시 안 함 (개별 라벨 스케일부터 노출)
          if (!groupsByKey[stationName]) {
            groupsByKey[stationName] = {
              station: stationName,
              members: [],
              bounds: new kakao.maps.LatLngBounds(),
            };
            stationGroups.push(groupsByKey[stationName]);
          }
          var g = groupsByKey[stationName];
          g.members.push(n);
          g.bounds.extend(n.bounds.getSouthWest());
          g.bounds.extend(n.bounds.getNorthEast());
        });

        stationGroups.forEach(function (g) {
          var label =
            "🚇 " +
            g.station +
            (g.members.length > 1 ? " +" + g.members.length : "");

          var el = document.createElement("div");
          el.textContent = label;
          el.style.cssText =
            "background:white; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:bold; color:#06474f; box-shadow:0 2px 8px rgba(8,94,106,0.25); white-space:nowrap; cursor:pointer; border:2px solid #085e6a;";
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            closeMapGuide();
            isPolygonClicked = true;
            setTimeout(function () {
              isPolygonClicked = false;
            }, 100);
            map.setBounds(g.bounds);
            // 화면 폭에 따라 fit 결과 줌이 달라질 수 있어, 개별 보기 기준보다 축소돼 있으면 강제로 보정
            if (map.getLevel() > NEIGHBORHOOD_ZOOM_THRESHOLD) {
              map.setLevel(NEIGHBORHOOD_ZOOM_THRESHOLD);
            }
            updateNeighborhoodVisibility();
            if (g.members.length === 1) {
              selectNeighborhood(g.members[0]);
            }
          });

          g.marker = new kakao.maps.CustomOverlay({
            position: boundsCenter(g.bounds),
            content: el,
            map: null,
            yAnchor: 0.5,
            zIndex: 25,
          });
        });
      }

      async function loadNeighborhoods() {
        var { data, error } = await sb.from("neighborhoods").select("*");
        if (error) {
          console.error("동네 목록 로딩 실패:", error);
          return;
        }
        data.forEach(function (row) {
          var path = row.polygon.map(function (p) {
            return new kakao.maps.LatLng(p.lat, p.lng);
          });
          var bounds = new kakao.maps.LatLngBounds();
          path.forEach(function (latlng) {
            bounds.extend(latlng);
          });

          var polygon = new kakao.maps.Polygon({
            map: null,
            path: path,
            strokeWeight: 3,
            strokeColor: isDevHighlighted(row) ? "#c76a15" : "#085e6a",
            fillColor: isDevHighlighted(row) ? "#c76a15" : "#085e6a",
            fillOpacity: 0.45,
            zIndex: 10,
            clickable: true,
          });

          // 확대 상태에서 항상 보이는 이름표 (폴리곤 자체는 이걸 눌러야 펼쳐짐)
          var nameLabelEl = document.createElement("div");
          nameLabelEl.textContent =
            (isDevHighlighted(row) ? "🚧 " : "") + row.name;
          nameLabelEl.style.cssText = isDevHighlighted(row)
            ? NAME_LABEL_STYLE_DEV
            : NAME_LABEL_STYLE;
          var labelPosition =
            row.label_lat != null && row.label_lng != null
              ? new kakao.maps.LatLng(row.label_lat, row.label_lng)
              : boundsCenter(bounds);
          var nameLabel = new kakao.maps.CustomOverlay({
            position: labelPosition,
            content: nameLabelEl,
            map: null,
            yAnchor: 1.3,
            zIndex: 20,
          });

          var entry = {
            id: row.id,
            row: row,
            labelEl: nameLabelEl,
            polygon: polygon,
            nameLabel: nameLabel,
            bounds: bounds,
          };

          var handler = function (e) {
            if (e.preventMap) e.preventMap();
            if (e.domEvent && e.domEvent.stopPropagation)
              e.domEvent.stopPropagation();
            selectNeighborhood(entry);
          };
          kakao.maps.event.addListener(polygon, "mousedown", handler);
          kakao.maps.event.addListener(polygon, "click", handler);
          kakao.maps.event.addListener(polygon, "mouseover", function () {
            mapContainer.classList.add("poly-hover");
          });
          kakao.maps.event.addListener(polygon, "mouseout", function () {
            mapContainer.classList.remove("poly-hover");
          });
          nameLabelEl.addEventListener("click", function (e) {
            e.stopPropagation();
            selectNeighborhood(entry);
          });

          neighborhoods.push(entry);
        });

        buildStationGroups();
        updateNeighborhoodVisibility();

        // 목록 패널을 데이터 로딩보다 먼저 열었을 때도 자동으로 최신 목록을 채운다.
        if (document.getElementById("neighborhood-list")) {
          openNeighborhoodList();
        }

        // 고유 링크(?n=동네ID)로 접속 시 해당 동네로 이동 + 패널 오픈
        var targetId = new URLSearchParams(location.search).get("n");
        if (targetId) {
          var target = neighborhoods.find(function (n) {
            return n.id === targetId;
          });
          if (target) {
            map.setBounds(target.bounds);
            if (map.getLevel() > NEIGHBORHOOD_ZOOM_THRESHOLD) {
              map.setLevel(NEIGHBORHOOD_ZOOM_THRESHOLD);
            }
            updateNeighborhoodVisibility();
            selectNeighborhood(target);
          }
        }
      }
      loadNeighborhoods();

      kakao.maps.event.addListener(map, "click", function () {
        closeMapGuide();
        if (!isPolygonClicked) {
          closeInfoPanel();
          closeSitePanel();
        }
        isPolygonClicked = false;
        document.getElementById("theme-panel").classList.remove("open");
        closeThemeCard();
      });

      // ══════════════ 큐레이션 테마 레이어 ══════════════
      var CATEGORY_EMOJI = {
        밥: "🍚",
        커피: "☕",
        간식: "🍡",
        카페: "☕",
        도서관: "📚",
        열린공간: "🏛️",
        공원: "🌳",
        산책로: "🛣️",
        전망: "🌇",
      };
      var themePins = [];
      var openThemeCollapse = null; // 지금 카드로 펼쳐진 핀을 다시 칩으로 접는 함수

      function closeThemeCard() {
        if (openThemeCollapse) {
          var fn = openThemeCollapse;
          openThemeCollapse = null;
          fn();
        }
      }

      function clearThemePins() {
        closeThemeCard();
        themePins.forEach(function (p) {
          p.setMap(null);
        });
        themePins = [];
      }

      var THEME_LABELS = {
        "": "🧭 테마 지도",
        혼밥: "🍚 혼밥 지도",
        공부: "✏️ 공부 지도",
        산책: "🚶 산책 지도",
      };

      async function selectTheme(theme) {
        closeMapGuide();
        document.getElementById("theme-btn-label").textContent =
          THEME_LABELS[theme];
        document.getElementById("theme-panel").classList.remove("open");
        document
          .getElementById("theme-toggle-btn")
          .classList.toggle("is-active", !!theme);
        clearThemePins();
        if (!theme) return;

        var { data, error } = await sb
          .from("curated_places")
          .select("*")
          .eq("layer", theme);
        if (error) {
          console.error("큐레이션 로딩 실패:", error);
          return;
        }
        data.forEach(function (place) {
          var emoji = CATEGORY_EMOJI[place.category] || "📌";
          var position = new kakao.maps.LatLng(place.lat, place.lng);

          var chipEl = document.createElement("div");
          chipEl.textContent = emoji + " " + place.name;
          chipEl.style.cssText =
            "background:#085e6a; color:white; padding:5px 12px; border-radius:20px; font-size:12.5px; font-weight:bold; white-space:nowrap; cursor:pointer; box-shadow:0 2px 8px rgba(8,94,106,0.4);";

          var pinOverlay = new kakao.maps.CustomOverlay({
            position: position,
            content: chipEl,
            // 역단위로 축소된 상태(showIndividual=false)에서는 처음부터 숨김
            map: map.getLevel() <= NEIGHBORHOOD_ZOOM_THRESHOLD ? map : null,
            yAnchor: 0, // 콘텐츠의 맨 위가 지점에 고정 (칩/카드 높이가 달라도 윗선이 항상 같음)
            zIndex: 50,
          });
          themePins.push(pinOverlay);

          var cardOverlay = null;

          function collapse() {
            if (cardOverlay) {
              cardOverlay.setMap(null);
              cardOverlay = null;
            }
            pinOverlay.setMap(map);
            if (openThemeCollapse === collapse) openThemeCollapse = null;
          }

          function expand() {
            closeThemeCard(); // 다른 핀이 펼쳐져 있으면 먼저 접기
            pinOverlay.setMap(null); // 칩을 감추고 그 자리에 카드가 대신 나타남

            var card = document.createElement("div");
            card.style.cssText =
              "position:relative; background:white; border-radius:12px; padding:14px 15px; width:200px; box-sizing:border-box; box-shadow:0 8px 24px rgba(8,94,106,0.35); font-family:inherit; white-space:normal; overflow-wrap:break-word; word-break:break-word;";

            var titleEl = document.createElement("div");
            titleEl.style.cssText =
              "font-weight:bold; font-size:14px; color:#06474f; margin-bottom:4px; white-space:normal; overflow-wrap:break-word; word-break:break-word;";
            titleEl.textContent = emoji + " " + place.name;
            card.appendChild(titleEl);

            if (place.comment) {
              var commentEl = document.createElement("div");
              commentEl.style.cssText =
                "font-size:12.5px; color:#555; line-height:1.5; margin-bottom:6px; white-space:normal; overflow-wrap:break-word; word-break:break-word;";
              commentEl.textContent = place.comment;
              card.appendChild(commentEl);
            }

            if (place.link) {
              var linkEl = document.createElement("a");
              linkEl.href = place.link;
              linkEl.target = "_blank";
              linkEl.textContent = "카카오맵에서 보기 →";
              linkEl.style.cssText =
                "display:inline-block; font-size:12px; color:#085e6a; font-weight:bold;";
              linkEl.addEventListener("click", function (e2) {
                e2.stopPropagation();
              });
              card.appendChild(linkEl);
            }

            cardOverlay = new kakao.maps.CustomOverlay({
              position: position,
              content: card,
              yAnchor: 0, // 칩과 동일 — 윗선이 칩 있던 자리 그대로 유지
              zIndex: 1000,
              map: map,
            });
            openThemeCollapse = collapse;
          }

          chipEl.addEventListener("click", function (e) {
            e.stopPropagation();
            expand();
          });
        });
      }
    </script>
  </body>
</html>
