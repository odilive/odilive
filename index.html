<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>어디살까? 자취하기 좋은 동네!</title>
    <meta
      name="description"
      content="직접 다녀보고 추천하는 자취 동네 지도. 동네를 누르면 교통·시세·분위기까지 한눈에 확인할 수 있습니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="어디살까? 자취하기 좋은 동네!" />
    <meta
      property="og:description"
      content="직접 다녀보고 추천하는 자취 동네"
    />
    <meta
      property="og:image"
      content="https://odilive.github.io/odilive/og-image.png?v=2"
    />
    <meta property="og:url" content="https://odilive.github.io/odilive/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link
      rel="preload"
      href="PyeongChangPeace-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&family=S-Core+Dream:wght@900&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "PyeongChangPeace-Bold";
        src: url("PyeongChangPeace-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
        font-display: swap;
      }

      :root {
        --brand-teal: #085e6a;
        --brand-teal-dark: #06474f;
        --brand-teal-tint: #eaf4f3;
        --ink: #16282b;
        --ink-soft: #4c6467;
        --line: #dbe6e5;
      }

      body {
        margin: 0;
        padding: 12px 20px 20px;
        background-color: #f2f6f6;
        color: var(--ink);
        height: 100vh;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }

      body,
      button,
      input,
      select,
      textarea {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 6px;
        padding: 4px 4px;
        flex-shrink: 0;
      }
      .header-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-wordmark {
        margin: 0;
        font-size: 26px;
        font-family: "PyeongChangPeace-Bold", sans-serif;
        font-weight: 700;
        color: var(--brand-teal);
        letter-spacing: -0.01em;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
      }
      .site-menu-btn {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--brand-teal-dark);
        font-size: 21px;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(8, 94, 106, 0.1);
      }
      .site-menu-btn:hover,
      .site-menu-btn[aria-expanded="true"] {
        background: var(--brand-teal-tint);
        border-color: var(--brand-teal);
      }
      .site-menu {
        display: none;
        position: absolute;
        top: 46px;
        right: 0;
        width: 220px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 28px rgba(8, 94, 106, 0.2);
        z-index: 30;
      }
      .site-menu.open {
        display: block;
      }
      .site-menu-item {
        display: flex;
        align-items: center;
        width: 100%;
        box-sizing: border-box;
        padding: 11px 12px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
      }
      .site-menu-item:hover {
        background: var(--brand-teal-tint);
        color: var(--brand-teal-dark);
      }
      .site-menu-item.is-soon {
        color: #8a9a9b;
        cursor: default;
      }
      .site-menu-item small {
        margin-left: auto;
        font-size: 10px;
        font-weight: 700;
        color: #9aa7a8;
      }

      #map-controls {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 10;
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 8px;
      }
      /* 초기 축척에서는 개별 동네 기능을 쓰지 않으므로, 데이터 로딩 전 깜빡임도 막는다. */
      #map-controls .ctrl-wrap,
      #brand-toggle-btn {
        visibility: hidden;
      }
      #map-wrap.map-controls-ready .ctrl-wrap,
      #map-wrap.map-controls-ready #brand-toggle-btn {
        visibility: visible;
      }

      .ctrl-wrap {
        position: relative;
      }

      .ctrl-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: inherit;
        font-size: 13px;
        font-weight: bold;
        padding: 7px 14px;
        border-radius: 20px;
        border: 2px solid var(--brand-teal);
        color: var(--brand-teal-dark);
        background: #fff;
        cursor: pointer;
        box-shadow: 0 2px 10px rgba(8, 94, 106, 0.2);
        transition:
          background 0.15s ease,
          color 0.15s ease,
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .ctrl-btn:hover {
        background: var(--brand-teal-tint);
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(8, 94, 106, 0.3);
      }
      .ctrl-btn.is-active,
      .ctrl-btn.is-active:hover {
        background: var(--brand-teal-dark);
        border-color: var(--brand-teal-dark);
        color: #fff;
        box-shadow:
          0 0 0 2px #fff inset,
          0 4px 14px rgba(8, 94, 106, 0.5);
      }
      .ctrl-caret {
        font-size: 9px;
        opacity: 0.85;
      }

      .ctrl-panel {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        margin-top: 8px;
        background: #fff;
        border-radius: 12px;
        padding: 8px;
        box-shadow: 0 8px 24px rgba(8, 94, 106, 0.25);
        flex-direction: column;
        gap: 3px;
        min-width: 160px;
        z-index: 20;
      }
      .ctrl-panel.open {
        display: flex;
      }
      .ctrl-option {
        font-family: inherit;
        text-align: left;
        padding: 9px 10px;
        border: none;
        background: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .ctrl-option:hover {
        background: var(--brand-teal-tint);
        color: var(--brand-teal-dark);
      }

      #map-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #map {
        width: 100%;
        height: 100%;
        border-radius: 14px;
        border: 1px solid var(--line);
        box-sizing: border-box;
        box-shadow: 0 4px 16px rgba(8, 94, 106, 0.12);
      }
      .poly-hover {
        cursor: pointer !important;
      }

      /* 상세 정보 패널 (PC: 오른쪽 슬라이드, 모바일: 하단 바텀시트) */
      #info-panel {
        position: fixed;
        top: 0;
        right: -400px;
        width: 390px;
        height: 100vh;
        background: white;
        z-index: 9999;
        padding: 32px 28px 20px;
        box-shadow: -5px 0 24px rgba(8, 94, 106, 0.16);
        transition: 0.3s ease-out;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      #info-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      #info-panel.open {
        right: 0;
      }
      #info-panel h3 {
        margin: 0 0 6px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--brand-teal-dark);
      }
      #info-tagline {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--brand-teal);
        margin-bottom: 16px;
      }
      #info-tagline:empty {
        display: none;
      }
      #info-desc .desc-heading {
        font-size: 13px;
        font-weight: 800;
        color: var(--brand-teal-dark);
        margin: 12px 0 3px;
      }
      #info-desc .desc-heading:first-child {
        margin-top: 0;
      }
      #info-desc .desc-line {
        font-size: 14px;
        color: var(--ink-soft);
        line-height: 1.7;
      }
      #info-specs {
        margin-bottom: 16px;
      }
      #info-specs div {
        display: flex;
        gap: 10px;
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 3px;
      }
      #info-specs .spec-label {
        flex-shrink: 0;
        width: 28px;
        font-weight: bold;
        color: var(--brand-teal);
      }
      #info-specs .spec-text {
        color: var(--ink-soft);
      }
      .spec-info-btn {
        border: 1.5px solid var(--ink-soft);
        background: none;
        padding: 0;
        margin: 0;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        font-size: 10px;
        font-weight: bold;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--ink-soft);
        flex-shrink: 0;
      }
      #info-specs .spec-info-tooltip {
        display: none;
        position: fixed;
        box-sizing: border-box;
        width: 300px;
        max-width: calc(100vw - 16px);
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--ink-soft);
        word-break: keep-all;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        z-index: 10000;
      }
      #info-specs .spec-info-tooltip.open {
        display: block;
      }
      .dev-stage-danger {
        color: #c76a15;
        font-weight: 800;
      }
      #info-specs .spec-info-note {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        color: #9aa7a8;
      }
      #info-links {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-shrink: 0;
      }
      #info-links:empty {
        display: none;
      }
      #info-links a {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: bold;
        text-decoration: none;
      }
      #info-links a svg {
        flex-shrink: 0;
      }
      #info-links .link-youtube {
        background: #fdeaea;
        color: #c0392b;
      }
      #info-links .link-blog {
        background: #e7f7ee;
        color: #059e4a;
      }
      #info-facts {
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      #info-facts.is-empty {
        display: none;
      }
      #info-amenities {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      #info-amenities:empty {
        display: none;
      }
      #info-amenities span {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: bold;
        white-space: nowrap;
      }
      #info-amenities .grade-O {
        background: var(--brand-teal-tint);
        color: var(--brand-teal-dark);
      }
      #info-amenities .grade-X {
        background: #eef1f1;
        color: #8a9a9b;
      }
      #info-facility-summary {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      #info-facility-summary span {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: bold;
        white-space: nowrap;
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink-soft);
      }
      #info-facility-summary span.count-zero {
        border-color: #eceff0;
        color: #b7c2c3;
      }
      #info-panel p {
        white-space: pre-wrap;
        line-height: 1.7;
        color: var(--ink-soft);
        font-size: 14px;
      }
      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #93a5a6;
      }
      .copy-btn {
        position: absolute;
        top: 24px;
        right: 54px;
        background: none;
        border: none;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #93a5a6;
        cursor: pointer;
      }
      #info-peek {
        display: none;
      }

      /* 메뉴에서 여는 Story·동네 목록 패널 */
      #site-panel {
        position: fixed;
        top: 0;
        right: -400px;
        width: 390px;
        height: 100vh;
        padding: 32px 28px 24px;
        box-sizing: border-box;
        background: #fff;
        box-shadow: -5px 0 24px rgba(8, 94, 106, 0.16);
        transition: right 0.3s ease-out;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #site-panel.open {
        right: 0;
      }
      #site-panel-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin-top: 28px;
        padding-right: 8px;
      }
      .panel-eyebrow {
        margin: 0 0 8px;
        color: var(--brand-teal);
        font-size: 12px;
        font-weight: 800;
      }
      .panel-title {
        margin: 0 36px 16px 0;
        color: var(--brand-teal-dark);
        font-size: 23px;
        line-height: 1.35;
        letter-spacing: -0.03em;
      }
      .story-panel-title {
        margin-right: 0;
        font-size: 18px;
        line-height: 1.45;
        letter-spacing: -0.045em;
      }
      .panel-copy {
        margin: 0 0 14px;
        color: var(--ink-soft);
        font-size: 14px;
        line-height: 1.75;
        word-break: keep-all;
      }
      .story-panel-copy {
        margin-bottom: 12px;
        font-size: 14px;
        line-height: 1.72;
      }
      .panel-note {
        margin-top: 22px;
        padding: 14px;
        border-radius: 12px;
        background: var(--brand-teal-tint);
        color: var(--brand-teal-dark);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.6;
      }
      .story-channel-links {
        display: none;
        gap: 8px;
        margin-top: 12px;
        flex-shrink: 0;
      }
      .story-channel-links.open {
        display: grid;
      }
      .story-channel-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 12px 14px;
        border: 0;
        border-radius: 10px;
        box-sizing: border-box;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        text-align: left;
      }
      .story-channel-link.youtube {
        background: #fdeaea;
        color: #c0392b;
      }
      .story-channel-link.blog {
        background: #e7f7ee;
        color: #059e4a;
      }
      .story-channel-link:disabled {
        cursor: default;
        opacity: 0.72;
      }
      .story-channel-link small {
        font-size: 11px;
        font-weight: 700;
      }
      .neighborhood-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .station-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .station-group {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        overflow: hidden;
      }
      .station-group-summary {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px;
        color: var(--brand-teal-dark);
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        list-style: none;
      }
      .station-line-badges {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }
      .station-line-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 19px;
        height: 19px;
        padding: 0 3px;
        border-radius: 50%;
        color: #fff;
        font-size: 10px;
        font-weight: 900;
        line-height: 1;
        box-sizing: border-box;
      }
      .station-line-1 {
        background: #0052a4;
      }
      .station-line-2 {
        background: #00a84d;
      }
      .station-line-4 {
        background: #00a5de;
      }
      .station-line-5 {
        background: #996cac;
      }
      .station-line-9 {
        background: #b39e35;
      }
      .station-line-sillim {
        background: #6789ca;
        font-size: 8px;
      }
      .station-group-name {
        white-space: nowrap;
      }
      .station-group-summary::-webkit-details-marker {
        display: none;
      }
      .station-group-summary::after {
        content: "⌄";
        margin-left: auto;
        color: var(--ink-soft);
        font-size: 16px;
        transition: transform 0.15s ease;
      }
      .station-group[open] .station-group-summary {
        border-bottom: 1px solid var(--line);
        background: var(--brand-teal-tint);
      }
      .station-group[open] .station-group-summary::after {
        transform: rotate(180deg);
      }
      .station-group-count {
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
      }
      .station-group-items {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
      }
      .neighborhood-list-item {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .neighborhood-list-item:hover {
        border-color: var(--brand-teal);
        background: var(--brand-teal-tint);
      }
      .neighborhood-list-item strong,
      .neighborhood-list-item span {
        display: block;
      }
      .neighborhood-list-item strong {
        color: var(--brand-teal-dark);
        font-size: 14px;
      }
      .neighborhood-list-item span {
        margin-top: 4px;
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.45;
      }
      .map-guide {
        position: absolute;
        top: 12px;
        left: 50%;
        max-width: 300px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 4px 16px rgba(8, 94, 106, 0.16);
        color: var(--ink-soft);
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.55;
        transform: translateX(-50%);
        z-index: 11;
      }
      .map-guide strong {
        color: var(--brand-teal-dark);
      }
      .map-guide-copy {
        display: block;
        white-space: nowrap;
      }
      .map-guide-close {
        position: absolute;
        top: 7px;
        right: 8px;
        border: 0;
        background: transparent;
        color: #93a5a6;
        font-size: 19px;
        cursor: pointer;
      }
      .sheet-handle {
        display: none;
      }

      @media (max-width: 1023px) {
        body {
          padding: 8px 10px 10px;
        }
        #info-panel {
          top: auto;
          right: 0;
          bottom: -100%;
          width: 100%;
          height: auto;
          max-height: 60vh;
          border-radius: 16px 16px 0 0;
          box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.2);
        }
        #info-panel.open {
          bottom: 0;
        }
        #info-panel.is-peek {
          height: auto;
          min-height: 126px;
          max-height: 45vh;
          padding: 24px 54px 12px 18px;
        }
        #info-panel.is-peek.expand-hint {
          animation: info-sheet-expand-hint 560ms ease-out;
        }
        #info-panel.is-peek.expand-hint #info-peek-next {
          animation: info-peek-next-hint 560ms ease-out;
        }
        #info-panel.is-peek .copy-btn,
        #info-panel.is-peek #info-scroll,
        #info-panel.is-peek #info-links {
          display: none;
        }
        #info-panel.is-peek #info-peek {
          display: flex;
          width: 100%;
          min-width: 0;
          flex-direction: column;
          align-items: stretch;
          justify-content: flex-start;
          padding: 0;
          color: inherit;
          text-align: left;
        }
        .info-peek-copy {
          min-width: 0;
          display: flex;

      // 모바일에서는 상단부를 끌거나, 본문이 맨 위일 때 아래로 당겨 패널을 닫을 수 있다.
      function enableMobileSheetDrag(panelId, scrollId, closePanel) {
        var panel = document.getElementById(panelId);
        var scroll = document.getElementById(scrollId);
        var startY = null;
        var distance = 0;
        var isDraggingSheet = false;

        panel.addEventListener("touchstart", function (e) {
          var usesSheetGesture =
            panelId === "info-panel"
              ? isPhoneInfoPanel()
              : isMobileInfoPanel();
          if (!usesSheetGesture) return;
          if (e.target.closest("button, a")) return;

          var panelTop = panel.getBoundingClientRect().top;
          var touchedTopArea = e.touches[0].clientY - panelTop < 88;
          var contentIsAtTop = scroll.scrollTop <= 0;
          var isCompactInfo =
            panelId === "info-panel" && panel.classList.contains("is-peek");
          if (!isCompactInfo && !touchedTopArea && !contentIsAtTop) return;

          startY = e.touches[0].clientY;
          distance = 0;
          isDraggingSheet = true;
        });

        panel.addEventListener(
          "touchmove",
          function (e) {
            if (!isDraggingSheet || startY === null) return;
            var rawDistance = e.touches[0].clientY - startY;
            if (rawDistance <= 0) {
              if (panelId === "info-panel" && panel.classList.contains("is-peek")) {
                if (rawDistance < -32) {
                  expandInfoPanel();
                  isDraggingSheet = false;
                  startY = null;
                }
                if (e.cancelable) e.preventDefault();
                return;
              }
              isDraggingSheet = false;
              startY = null;
              return;
            }
            distance = rawDistance;
            panel.style.transition = "none";
            panel.style.transform = "translateY(" + distance + "px)";
            if (e.cancelable) e.preventDefault();
          },
          { passive: false },
        );

        function finishSheetDrag() {
          if (!isDraggingSheet || startY === null) return;
          if (distance > 90) {
            panel.style.transition = "bottom 0.3s ease-out";
            var result = closePanel();
            if (result === "minimized") {
              // 전체 창 → 축소 창은 화면 밖으로 보냈다가 다시 띄우지 않는다.
              panel.style.transition = "none";
              panel.style.transform = "";
              window.requestAnimationFrame(function () {
                panel.style.transition = "";
              });
            } else {
              // 끌어내린 위치를 유지한 채 아래로 보낸다.
              // 여기서 transform을 지우면 원위치로 한 프레임 튀어 보인다.
              window.setTimeout(function () {
                panel.style.transform = "";
                panel.style.transition = "";
              }, 320);
            }
          } else {
            panel.style.transition = "";
            panel.style.transform = "";
          }
          startY = null;
          distance = 0;
          isDraggingSheet = false;
        }

        panel.addEventListener("touchend", finishSheetDrag);
        panel.addEventListener("touchcancel", finishSheetDrag);
      }

          var handleResults = function (data, status) {

              data.forEach((place) => {
                var finalIcon = brandData[brand].icon;

                if (!brandData[brand].markers[place.id]) {
                  var imageSize = new kakao.maps.Size(30, 30);
                  var markerImage = new kakao.maps.MarkerImage(
                    finalIcon,
                    imageSize,
                  );

                  var marker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(place.y, place.x),
                    image: markerImage,
                    map: map,
                    zIndex: brandPriority[brand] || 10,
                  });

                  if (brand === "대형슈퍼") {
                    var content = `
                      <div style="padding:6px 10px; font-size:12px; font-weight:bold; color:#06474f; white-space:nowrap; text-align:center; font-family:sans-serif;">
                        ${place.place_name}
                      </div>
                    `;
                    kakao.maps.event.addListener(
                      marker,
                      "mouseover",
                      function () {
                        infoWindow.setContent(content);
                        infoWindow.open(map, marker);
                      },
                    );
                    kakao.maps.event.addListener(
                      marker,
                      "mouseout",
                      function () {
                        infoWindow.close();
                      },
                    );
                  }

                  kakao.maps.event.addListener(marker, "click", function () {
                    if (place.place_url) {
                      window.open(place.place_url, "_blank");
                    }
                  });

                  brandData[brand].markers[place.id] = marker;
                }
              });
            }
          };

          brandData[brand].keywords.forEach((keyword) => {
            ps.keywordSearch(keyword, handleResults, { bounds: bounds });
          });
          (brandData[brand].categories || []).forEach((code) => {
            ps.categorySearch(code, handleResults, { bounds: bounds });
          });
        });
      }

      function toggleBrand(brand) {
        var state = brandData[brand];
        state.active = !state.active;
        Object.values(state.markers).forEach((marker) => {
          marker.setMap(state.active ? map : null);
        });
        if (state.active) {
          clearNearbyBrandMarkers(brand); // 상세정보용으로 떠있던 마커와 중복되지 않게 정리
          updateBrandMarkers();
        }
        updateBrandToggleBtnState();
      }

      // 하나라도 켜져있으면 "자취 인프라" 버튼 자체도 켜진 것으로 표시
      function updateBrandToggleBtnState() {
        var anyActive = Object.keys(brandData).some(function (brand) {
          return brandData[brand].active;
        });
        document
          .getElementById("brand-toggle-btn")
          .classList.toggle("is-active", anyActive);
      }

      // 다이소·올리브영·스벅·대형슈퍼를 "우리가 정한 인프라 세트"로 한 번에 켜고 끔
      function toggleAllBrands() {
        closeMapGuide();
        closeSiteMenu();
        var allActive = Object.keys(brandData).every(function (brand) {
          return brandData[brand].active;
        });
        Object.keys(brandData).forEach(function (brand) {
          if (allActive === brandData[brand].active) toggleBrand(brand);
        });
        // 전체 인프라를 다시 끈 뒤에도 동네 상세가 열려 있다면,
        // 해당 동네를 위한 반경 인프라 표시는 원래 상태로 되돌린다.
        if (
          allActive &&
          selectedNeighborhood &&
          selectedNeighborhood.row.show_facilities !== false
        ) {
          renderNearbyBrandMarkers(selectedNeighborhood.bounds);
        }
      }

      function toggleThemePanel() {
        closeMapGuide();
        closeSiteMenu();
        document.getElementById("theme-panel").classList.toggle("open");
      }

      kakao.maps.event.addListener(map, "idle", updateBrandMarkers);
      kakao.maps.event.addListener(map, "zoom_changed", function () {
        closeMapGuide();
        updateNeighborhoodVisibility();
      });
      kakao.maps.event.addListener(map, "dragstart", closeMapGuide);
      updateBrandMarkers();

      // ── 저장된 동네 불러오기 (읽기 전용) ──
      var isPolygonClicked = false;
      var NEIGHBORHOOD_ZOOM_THRESHOLD = 5; // 이 레벨보다 확대되면(숫자가 작아지면) 폴리곤, 아니면 마커
      var neighborhoods = [];
      var subMarkers = [];
      var developmentOverlaysByNeighborhood = {};
      var visibleDevelopmentOverlays = [];
      var visibleDevelopmentOverlayLabels = [];

      function clearSubMarkers() {
        subMarkers.forEach(function (marker) {
          marker.setMap(null);
        });
        subMarkers = [];
      }

      function clearDevelopmentOverlays() {
        visibleDevelopmentOverlays.forEach(function (overlay) {
          overlay.setMap(null);
        });
        visibleDevelopmentOverlays = [];
        visibleDevelopmentOverlayLabels.forEach(function (label) {
          label.setMap(null);
        });
        visibleDevelopmentOverlayLabels = [];
      }

      function renderDevelopmentOverlays(neighborhoodId) {
        clearDevelopmentOverlays();
        (developmentOverlaysByNeighborhood[neighborhoodId] || []).forEach(
          function (item) {
            var path = (item.polygon || []).map(function (point) {
              return new kakao.maps.LatLng(point.lat, point.lng);
            });
            if (path.length < 3) return;
            var bounds = new kakao.maps.LatLngBounds();
            path.forEach(function (point) {
              bounds.extend(point);
            });
            var overlay = new kakao.maps.Polygon({
              map: map,
              path: path,
              strokeWeight: 2,
              strokeColor: "#c76a15",
              strokeOpacity: 0.9,
              strokeStyle: "dash",
              fillColor: "#c76a15",
              fillOpacity: 0.14,
              zIndex: 12,
              clickable: false,
            });
            visibleDevelopmentOverlays.push(overlay);

            var labelElement = document.createElement("div");
            labelElement.textContent = item.name || "재개발 구역";
            labelElement.style.cssText =
              "pointer-events:none; padding:3px 7px; border:1px solid #d9aa80; border-radius:5px; background:rgba(255,255,255,.9); color:#ad6729; font-size:11px; font-weight:700; white-space:nowrap; box-shadow:0 1px 3px rgba(128,76,24,.1);";
            var label = new kakao.maps.CustomOverlay({
              position: boundsCenter(bounds),
              content: labelElement,
              map: map,
              yAnchor: 0.5,
              zIndex: 13,
            });
            visibleDevelopmentOverlayLabels.push(label);
          },
        );
      }

      async function loadDevelopmentOverlays() {
        var { data, error } = await sb
          .from("development_overlays")
          .select("neighborhood_id, name, polygon");
        if (error) {
          console.error("재개발 보조 경계 로딩 실패:", error);
          return;
        }
        developmentOverlaysByNeighborhood = (data || []).reduce(function (
          groups,
          item,
        ) {
          if (!groups[item.neighborhood_id]) groups[item.neighborhood_id] = [];
          groups[item.neighborhood_id].push(item);
          return groups;
        }, {});
        if (selectedNeighborhood) {
          renderDevelopmentOverlays(selectedNeighborhood.id);
        }
      }

      // 저장 시점에 DB에 스냅샷된 편의점/약국/빨래방을 이모지로 표출 (API 재호출 없음)
      function renderCachedFacilities(facilities) {
        clearSubMarkers();
        facilities.forEach(function (f) {
          var content = `
            <div style="font-size: 16px; line-height: 1; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3)); cursor: default; user-select: none;">
              ${f.emoji}
            </div>
          `;
          var customOverlay = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(f.lat, f.lng),
            content: content,
            xAnchor: 0.5,
            yAnchor: 0.5,
          });
          customOverlay.setMap(map);
          subMarkers.push(customOverlay);
        });
      }

      // 편·약·빨 세 항목을 0개여도 항상 고정 표시
      var FACILITY_TYPES = [
        { type: "편의점", label: "편의점", emoji: "🏪" },
        { type: "약국", label: "약국", emoji: "💊" },
        { type: "셀프빨래방", label: "빨래방", emoji: "🧺" },
      ];

      function buildFacilitySummary(facilities) {
        return FACILITY_TYPES.map(function (ft) {
          var count = (facilities || []).filter(function (f) {
            return f.type === ft.type;
          }).length;
          var cls = count === 0 ? ' class="count-zero"' : "";
          return (
            "<span" +
            cls +
            ">" +
            ft.emoji +
            " " +
            ft.label +
            " " +
            count +
            "</span>"
          );
        }).join("");
      }

      // 다이소/올리브영/대형슈퍼 ○/△/✕ 칩 (관리자가 직접 판정한 값)
      function buildAmenityChips(amenities) {
        var GRADE_DISPLAY = { O: "○", "△": "△", X: "✕" };
        var GRADE_CLASS = { O: "grade-O", "△": "grade-O", X: "grade-X" };
        var AMENITY_LOGO = {
          다이소: "daiso.png",
          올리브영: "olive.png",
          대형슈퍼: "ssm.png",
        };
        return ["다이소", "올리브영", "대형슈퍼"]
          .filter(function (item) {
            return amenities && amenities[item];
          })
          .map(function (item) {
            var g = amenities[item];
            return (
              '<span class="' +
              GRADE_CLASS[g] +
              '"><img src="' +
              AMENITY_LOGO[item] +
              '" alt="" style="height:15px; width:auto; vertical-align:-3px; margin-right:4px;">' +
              item +
              " " +
              GRADE_DISPLAY[g] +
              "</span>"
            );
          })
          .join("");
      }

      // [소제목] 으로 시작하는 줄을 굵은 소제목으로 렌더링
      function renderDescription(text) {
        function esc(s) {
          return s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }
        return (text || "")
          .split("\n")
          .map(function (line) {
            var m = line.match(/^\[(.+?)\]\s*(.*)$/);
            if (m) {
              return (
                '<div class="desc-heading">' +
                esc(m[1]) +
                "</div>" +
                (m[2] ? '<div class="desc-line">' + esc(m[2]) + "</div>" : "")
              );
            }
            if (line.trim() === "") return "";
            return '<div class="desc-line">' + esc(line) + "</div>";
          })
          .join("");
      }

      var currentRow = null; // 패널에 열려있는 동네 (링크 복사용)

      function copyNeighborhoodLink() {
        if (!currentRow) return;
        var url = location.origin + location.pathname + "?n=" + currentRow.id;
        var btn = document.getElementById("btn-copy-link");
        var originalIcon = btn.innerHTML;
        function done() {
          btn.textContent = "✅";
          setTimeout(function () {
            btn.innerHTML = originalIcon;
          }, 1500);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, function () {
            prompt("아래 주소를 복사하세요:", url);
          });
        } else {
          prompt("아래 주소를 복사하세요:", url);
        }
      }

      function positionSpecTooltip(btn, tip) {
        var margin = 8;
        var tipWidth = Math.min(300, window.innerWidth - margin * 2);
        var rect = btn.getBoundingClientRect();
        var left = Math.min(
          Math.max(margin, rect.left),
          window.innerWidth - tipWidth - margin,
        );
        tip.style.left = left + "px";
        var spaceBelow = window.innerHeight - rect.bottom;
        if (spaceBelow < 170) {
          tip.style.bottom = window.innerHeight - rect.top + 6 + "px";
          tip.style.top = "auto";
        } else {
          tip.style.top = rect.bottom + 6 + "px";
          tip.style.bottom = "auto";
        }
      }

      function toggleSpecInfo(e) {
        e.stopPropagation();
        var btn = e.target;
        var tip = btn.nextElementSibling;
        var wasOpen = tip.classList.contains("open");
        document
          .querySelectorAll(".spec-info-tooltip.open")
          .forEach(function (t) {
            t.classList.remove("open");
          });
        if (!wasOpen) {
          positionSpecTooltip(btn, tip);
          tip.classList.add("open");
        }
      }
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".spec-row-info")) {
          document
            .querySelectorAll(".spec-info-tooltip.open")
            .forEach(function (t) {
              t.classList.remove("open");
            });
        }
      });

      function formatSpecText(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;")
          .replace(/\r?\n/g, "<br>");
      }

      function openInfoPanel(row, bounds) {
        currentRow = row;
        document.getElementById("info-name").textContent = row.name;
        document.getElementById("info-peek-name").textContent = row.name;
        document.getElementById("info-tagline").textContent = row.tagline
          ? "“" + row.tagline + "”"
          : "";
        document.getElementById("info-peek-tagline").textContent =
          row.tagline ? "“" + row.tagline + "”" : "";
        var peekNext = document.getElementById("info-peek-next");
        var peekNextLabel = row.transit
          ? "교통"
          : row.price
            ? "시세"
            : row.development
              ? "개발"
              : "";
        var peekNextValue = row.transit || row.price || row.development || "";
        peekNext.replaceChildren();
        if (peekNextValue) {
          var peekLabel = document.createElement("span");
          peekLabel.className = "info-peek-next-label";
          peekLabel.textContent = peekNextLabel;
          var peekText = document.createElement("span");
          peekText.textContent = peekNextValue;
          peekNext.append(peekLabel, peekText);
        }
        document.getElementById("info-desc").innerHTML = "";

        var specs = "";
        var developmentSpec = "";
        if (row.development)
          developmentSpec +=
            '<div class="spec-row-info"><span class="spec-label">개발</span><span class="spec-text">' +
            formatSpecText(row.development) +
            '</span><button class="spec-info-btn" onclick="toggleSpecInfo(event)">?</button>' +
            '<div class="spec-info-tooltip">정비구역지정 → 조합설립인가 → 사업시행인가 → ' +
            '<span class="dev-stage-danger">관리처분인가</span> → ' +
            '<span class="dev-stage-danger">이주·철거</span> → 착공 → 준공' +
            '<div class="spec-info-note">사업 유형에 따라 단계가 다를 수 있어요</div>' +
            "</div></div>";
        if (row.transit)
          specs +=
            '<div class="spec-row-info"><span class="spec-label">교통</span><span class="spec-text">' +
            row.transit +
            '</span><button class="spec-info-btn" onclick="toggleSpecInfo(event)">?</button>' +
            '<div class="spec-info-tooltip">도보이동 제외한 지하철 소요시간 기준이에요.' +
            "</div></div>";
        if (row.price)
          specs +=
            '<div><span class="spec-label">시세</span><span class="spec-text">' +
            row.price +
            "</span></div>";
        specs += developmentSpec;
        document.getElementById("info-specs").innerHTML = specs;

        var amenitiesHtml = buildAmenityChips(row.amenities);
        var facilitySummaryHtml =
          row.show_facilities === false
            ? ""
            : buildFacilitySummary(row.facilities);
        document.getElementById("info-amenities").innerHTML = amenitiesHtml;
        document.getElementById("info-facility-summary").innerHTML =
          facilitySummaryHtml;
        document
          .getElementById("info-facts")
          .classList.toggle("is-empty", !amenitiesHtml && !facilitySummaryHtml);

        var YT_ICON =
          '<svg width="17" height="17" viewBox="0 0 24 24"><path fill="#FF0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8z"/><path fill="#fff" d="M9.5 15.5v-7l6.3 3.5-6.3 3.5z"/></svg>';
        var NAVER_ICON =
          '<svg width="13" height="13" viewBox="0 0 20 20"><rect width="20" height="20" rx="3" fill="#03C75A"/><path fill="#fff" d="M11.35 10.25 8.5 6.19H5.81v7.62H8.5v-4.06l2.85 4.06h2.69V6.19h-2.69v4.06z"/></svg>';

        var links = "";
        if (row.youtube_url)
          links +=
            '<a class="link-youtube" href="' +
            row.youtube_url +
            '" target="_blank">' +
            YT_ICON +
            " 답사 영상</a>";
        if (row.blog_url)
          links +=
            '<a class="link-blog" href="' +
            row.blog_url +
            '" target="_blank">' +
            NAVER_ICON +
            " 답사 기행 읽기</a>";
        document.getElementById("info-links").innerHTML = links;

        var infoPanel = document.getElementById("info-panel");
        infoPanel.classList.remove("is-closing-peek");
        infoPanel.classList.add("open");
        infoPanel.classList.toggle(
          "is-peek",
          isPhoneInfoPanel(),
        );
        if (infoPanel.classList.contains("is-peek")) hintInfoPanelExpansion();
        // 편·빨·약 표시를 끈 동네는 상세 요약뿐 아니라 지도 이모지도 보여주지 않는다.
        // 빈 배열을 전달해 이전에 열었던 동네의 이모지도 함께 정리한다.
        renderCachedFacilities(
          row.show_facilities === false ? [] : row.facilities || [],
        );
        renderDevelopmentOverlays(row.id);
        // 재개발구역처럼 생활 인프라 표시를 끈 동네는 주변 자취 인프라도 자동 표출하지 않는다.
        if (bounds && row.show_facilities !== false) renderNearbyBrandMarkers(bounds);
      }

      // 폴리곤 바운딩박스를 상하좌우로 meters만큼 넓힘 (경계 기준 버퍼)
      function padBounds(bounds, meters) {
        var sw = bounds.getSouthWest();
        var ne = bounds.getNorthEast();
        var avgLat = ((sw.getLat() + ne.getLat()) / 2) * (Math.PI / 180);
        var latPad = meters / 111000;
        var lngPad = meters / (111000 * Math.cos(avgLat));
        return new kakao.maps.LatLngBounds(
          new kakao.maps.LatLng(sw.getLat() - latPad, sw.getLng() - lngPad),
          new kakao.maps.LatLng(ne.getLat() + latPad, ne.getLng() + lngPad),
        );
      }

      // 동네 상세정보를 열 때, 그 동네 경계에서 500m 이내의 자취인프라(다이소·올리브영·스벅·대형슈퍼)를
      // 자취인프라 토글 상태와 무관하게 정확한 위치 참고용으로 같이 보여줌
      var BRAND_NEARBY_BUFFER_METERS = 500;
      var nearbyBrandMarkers = {}; // 상세정보에서 보여준 브랜드별 마커 (토글이 나중에 켜지면 정리용)

      function clearNearbyBrandMarkers(brand) {
        (nearbyBrandMarkers[brand] || []).forEach(function (marker) {
          marker.setMap(null);
        });
        nearbyBrandMarkers[brand] = [];
      }

      function renderNearbyBrandMarkers(bounds) {
        bounds = padBounds(bounds, BRAND_NEARBY_BUFFER_METERS);
        Object.keys(brandData).forEach(function (brand) {
          // 자취인프라 토글이 이미 켜진 브랜드는 그쪽 검색이 알아서 보여주니 중복 검색 생략
          if (brandData[brand].active) return;
          nearbyBrandMarkers[brand] = nearbyBrandMarkers[brand] || [];
          var icon = brandData[brand].icon;
          var handleResults = function (data, status) {
            if (status !== kakao.maps.services.Status.OK) return;
            data.forEach(function (place) {
              var marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(place.y, place.x),
                image: new kakao.maps.MarkerImage(
                  icon,
                  new kakao.maps.Size(30, 30),
                ),
                map: map,
                zIndex: 40,
              });
              kakao.maps.event.addListener(marker, "click", function () {
                if (place.place_url) window.open(place.place_url, "_blank");
              });
              subMarkers.push(marker);
              nearbyBrandMarkers[brand].push(marker);
            });
          };
          brandData[brand].keywords.forEach(function (keyword) {
            ps.keywordSearch(keyword, handleResults, { bounds: bounds });
          });
          (brandData[brand].categories || []).forEach(function (code) {
            ps.categorySearch(code, handleResults, { bounds: bounds });
          });
        });
      }

      var selectedNeighborhood = null; // 지금 폴리곤이 펼쳐져 보이는 동네 (한 번에 하나만)

      var NAME_LABEL_STYLE =
        "background:white; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; color:#06474f; box-shadow:0 2px 6px rgba(8,94,106,0.3); white-space:nowrap; cursor:pointer; border:1.5px solid #085e6a;";
      var NAME_LABEL_STYLE_SELECTED =
        "background:#06474f; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; color:#fff; box-shadow:0 0 0 2px #fff inset, 0 3px 10px rgba(8,94,106,0.5); white-space:nowrap; cursor:pointer; border:1.5px solid #06474f;";
      var NAME_LABEL_STYLE_DEV =
        "background:#fdf0e3; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; color:#c76a15; box-shadow:0 2px 6px rgba(199,106,21,0.3); white-space:nowrap; cursor:pointer; border:1.5px solid #c76a15;";
      var NAME_LABEL_STYLE_DEV_SELECTED =
        "background:#c76a15; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; color:#fff; box-shadow:0 0 0 2px #fff inset, 0 3px 10px rgba(199,106,21,0.5); white-space:nowrap; cursor:pointer; border:1.5px solid #c76a15;";

      function isDevHighlighted(row) {
        return !!(
          row &&
          row.development &&
          row.development_highlight === true
        );
      }

      function labelStyleFor(n, selected) {
        var isDev = isDevHighlighted(n.row);
        if (selected)
          return isDev
            ? NAME_LABEL_STYLE_DEV_SELECTED
            : NAME_LABEL_STYLE_SELECTED;
        return isDev ? NAME_LABEL_STYLE_DEV : NAME_LABEL_STYLE;
      }

      function closeInfoPanel() {
        clearSubMarkers();
        clearDevelopmentOverlays();
        var panel = document.getElementById("info-panel");
        var wasPeek = panel.classList.contains("is-peek");
        panel.classList.remove("open", "expand-hint");
        if (wasPeek) {
          // 축소 높이를 유지한 채 화면 밖으로 보낸 뒤에만 상태를 정리한다.
          // 그렇지 않으면 전체 높이로 잠깐 커지며 위로 튀어 보인다.
          panel.classList.add("is-closing-peek");
          window.setTimeout(function () {
            if (panel.classList.contains("is-closing-peek") && !panel.classList.contains("open")) {
              panel.classList.remove("is-peek", "is-closing-peek");
            }
          }, 320);
        } else {
          panel.classList.remove("is-peek", "is-closing-peek");
        }
        if (selectedNeighborhood) {
          selectedNeighborhood.polygon.setMap(null);
          selectedNeighborhood.labelEl.style.cssText = labelStyleFor(
            selectedNeighborhood,
            false,
          );
          selectedNeighborhood = null;
        }
      }

      function isMobileInfoPanel() {
        return window.matchMedia("(max-width: 1023px)").matches;
      }

      function isPhoneInfoPanel() {
        return window.matchMedia("(max-width: 600px)").matches;
      }

      window.addEventListener("resize", function () {
        var panel = document.getElementById("info-panel");
        if (!isPhoneInfoPanel() && panel.classList.contains("open")) {
          panel.classList.remove("is-peek", "expand-hint");
        }
      });

      // 모바일에서는 창을 접어도 선택한 동네와 지도 위 정보는 그대로 둔다.
      function minimizeInfoPanel() {
        if (!isPhoneInfoPanel()) {
          closeInfoPanel();
          return;
        }
        var panel = document.getElementById("info-panel");
        if (panel.classList.contains("open")) panel.classList.add("is-peek");
      }

      function handleInfoSheetPullDown() {
        var panel = document.getElementById("info-panel");
        if (panel.classList.contains("is-peek")) {
          closeInfoPanel();
          return "closed";
        }
        minimizeInfoPanel();
        return "minimized";
      }

      function expandInfoPanel() {
        document
          .getElementById("info-panel")
          .classList.remove("is-peek", "expand-hint");
      }

      function hintInfoPanelExpansion() {
        var panel = document.getElementById("info-panel");
        panel.classList.remove("expand-hint");
        window.requestAnimationFrame(function () {
          if (panel.classList.contains("is-peek")) {
            panel.classList.add("expand-hint");
          }
        });
      }

      function handleInfoClose() {
        closeInfoPanel();
      }

      // 정보창에 가려지지 않도록 선택한 라벨을 남은 지도 영역의 중심으로 옮긴다.
      function focusSelectedNeighborhood(neighborhood) {
        if (!neighborhood || !neighborhood.nameLabel) return;

        var panel = document.getElementById("info-panel");
        var mapWidth = mapContainer.clientWidth;
        var mapHeight = mapContainer.clientHeight;
        var projection = map.getProjection();
        var labelPoint = projection.containerPointFromCoords(
          neighborhood.nameLabel.getPosition(),
        );
        var desiredX = mapWidth / 2;
        var desiredY = mapHeight / 2;
        var usesBottomSheet = isMobileInfoPanel();

        if (usesBottomSheet) {
          // 하단 시트 위에 남는 지도 영역의 중앙에 라벨을 둔다.
          var sheetHeight = panel.getBoundingClientRect().height;
          desiredY = Math.max(80, (mapHeight - sheetHeight) / 2);
        } else {
          // 사이드바를 제외한 왼쪽 지도 영역의 중앙에 라벨을 둔다.
          var visibleMapWidth = mapWidth - panel.getBoundingClientRect().width;
          if (visibleMapWidth <= 0) return;
          desiredX = visibleMapWidth / 2;
        }

        var shiftX = labelPoint.x - desiredX;
        var shiftY = usesBottomSheet ? labelPoint.y - desiredY : 0;
        // 이미 목표 위치에 충분히 가깝다면 불필요하게 지도를 움직이지 않는다.
        if (Math.abs(shiftX) < 36 && Math.abs(shiftY) < 36) return;

        var centerPoint = projection.containerPointFromCoords(map.getCenter());
        var nextCenter = projection.coordsFromContainerPoint(
          new kakao.maps.Point(
            centerPoint.x + shiftX,
            centerPoint.y + shiftY,
          ),
        );
        map.panTo(nextCenter);
      }

      // 이름표를 클릭했을 때: 그 동네만 폴리곤을 펼치고, 이전에 펼쳐져 있던 폴리곤은 접음
      function selectNeighborhood(n) {
        closeMapGuide();
        closeSiteMenu();
        if (selectedNeighborhood && selectedNeighborhood !== n) {
          selectedNeighborhood.polygon.setMap(null);
          selectedNeighborhood.labelEl.style.cssText = labelStyleFor(
            selectedNeighborhood,
            false,
          );
        }
        selectedNeighborhood = n;
        n.polygon.setMap(map);
        n.labelEl.style.cssText = labelStyleFor(n, true);
        isPolygonClicked = true;
        setTimeout(function () {
          isPolygonClicked = false;
        }, 100);
        openInfoPanel(n.row, n.bounds);
        focusSelectedNeighborhood(n);
      }

      var stationGroups = [];

      function boundsCenter(b) {
        var sw = b.getSouthWest();
        var ne = b.getNorthEast();
        return new kakao.maps.LatLng(
          (sw.getLat() + ne.getLat()) / 2,
          (sw.getLng() + ne.getLng()) / 2,
        );
      }

      // 현재 줌 레벨에 따라 "이름표들" ↔ "역 단위 그룹 라벨"을 전환 (폴리곤 자체는 선택했을 때만 보임)
      function updateNeighborhoodVisibility() {
        var showIndividual = map.getLevel() <= NEIGHBORHOOD_ZOOM_THRESHOLD;
        neighborhoods.forEach(function (n) {
          n.nameLabel.setMap(showIndividual ? map : null);
        });
        stationGroups.forEach(function (g) {
          g.marker.setMap(showIndividual ? null : map);
        });
        // 역단위로 축소된 상태에서는 큐레이션 핀·자취인프라 마커도 같이 숨겨서 소음을 줄임
        closeThemeCard();
        themePins.forEach(function (p) {
          p.setMap(showIndividual ? map : null);
        });
        updateBrandMarkerVisibility();
        // 이 줌에서는 기능 자체가 무의미하니 버튼도 같이 숨김 (눌러도 반응 없어 보이는 것 방지)
        document.querySelector(".ctrl-wrap").style.display = showIndividual
          ? ""
          : "none";
        document.getElementById("brand-toggle-btn").style.display =
          showIndividual ? "" : "none";
        document.getElementById("map-wrap").classList.add("map-controls-ready");
        if (!showIndividual) {
          closeInfoPanel(); // 축소되면 선택 해제 + 펼쳐진 폴리곤·이모지·패널 정리
        }
      }

      function updateBrandMarkerVisibility() {
        var showIndividual = map.getLevel() <= NEIGHBORHOOD_ZOOM_THRESHOLD;
        Object.keys(brandData).forEach(function (brand) {
          var state = brandData[brand];
          Object.values(state.markers).forEach(function (marker) {
            marker.setMap(state.active && showIndividual ? map : null);
          });
        });
      }

      // 같은 역(row.station) 기준으로 동네들을 묶어서, 축소 상태에서 역당 라벨 하나만 표시
      function buildStationGroups() {
        stationGroups.forEach(function (g) {
          g.marker.setMap(null);
        });
        stationGroups = [];

        var groupsByKey = {};
        neighborhoods.forEach(function (n) {
          var stationName = n.row.station && n.row.station.trim();
          if (!stationName) return; // 역 미입력 동네는 축소 상태에서 표시 안 함 (개별 라벨 스케일부터 노출)
          if (!groupsByKey[stationName]) {
            groupsByKey[stationName] = {
              station: stationName,
              members: [],
              bounds: new kakao.maps.LatLngBounds(),
            };
            stationGroups.push(groupsByKey[stationName]);
          }
          var g = groupsByKey[stationName];
          g.members.push(n);
          g.bounds.extend(n.bounds.getSouthWest());
          g.bounds.extend(n.bounds.getNorthEast());
        });

        stationGroups.forEach(function (g) {
          var label =
            "🚇 " +
            g.station +
            (g.members.length > 1 ? " +" + g.members.length : "");

          var el = document.createElement("div");
          el.textContent = label;
          el.style.cssText =
            "background:white; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:bold; color:#06474f; box-shadow:0 2px 8px rgba(8,94,106,0.25); white-space:nowrap; cursor:pointer; border:2px solid #085e6a;";
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            closeMapGuide();
            closeSiteMenu();
            isPolygonClicked = true;
            setTimeout(function () {
              isPolygonClicked = false;
            }, 100);
            map.setBounds(g.bounds);
            // 화면 폭에 따라 fit 결과 줌이 달라질 수 있어, 개별 보기 기준보다 축소돼 있으면 강제로 보정
            if (map.getLevel() > NEIGHBORHOOD_ZOOM_THRESHOLD) {
              map.setLevel(NEIGHBORHOOD_ZOOM_THRESHOLD);
            }
            updateNeighborhoodVisibility();
            if (g.members.length === 1) {
              selectNeighborhood(g.members[0]);
            }
          });

          g.marker = new kakao.maps.CustomOverlay({
            position: boundsCenter(g.bounds),
            content: el,
            map: null,
            yAnchor: 0.5,
            zIndex: 25,
          });
        });
      }

      async function loadNeighborhoods() {
        var { data, error } = await sb
          .from("neighborhoods")
          .select("*")
          .eq("published", true);
        if (error) {
          console.error("동네 목록 로딩 실패:", error);
          return;
        }
        data.forEach(function (row) {
          var path = row.polygon.map(function (p) {
            return new kakao.maps.LatLng(p.lat, p.lng);
          });
          var bounds = new kakao.maps.LatLngBounds();
          path.forEach(function (latlng) {
            bounds.extend(latlng);
          });

          var polygon = new kakao.maps.Polygon({
            map: null,
            path: path,
            strokeWeight: 3,
            strokeColor: isDevHighlighted(row) ? "#c76a15" : "#085e6a",
            fillColor: isDevHighlighted(row) ? "#c76a15" : "#085e6a",
            fillOpacity: 0.45,
            zIndex: 10,
            clickable: true,
          });

          // 확대 상태에서 항상 보이는 이름표 (폴리곤 자체는 이걸 눌러야 펼쳐짐)
          var nameLabelEl = document.createElement("div");
          nameLabelEl.textContent =
            (isDevHighlighted(row) ? "🚧 " : "") + row.name;
          nameLabelEl.style.cssText = isDevHighlighted(row)
            ? NAME_LABEL_STYLE_DEV
            : NAME_LABEL_STYLE;
          var labelPosition =
            row.label_lat != null && row.label_lng != null
              ? new kakao.maps.LatLng(row.label_lat, row.label_lng)
              : boundsCenter(bounds);
          var nameLabel = new kakao.maps.CustomOverlay({
            position: labelPosition,
            content: nameLabelEl,
            map: null,
            yAnchor: 1.3,
            zIndex: 20,
          });

          var entry = {
            id: row.id,
            row: row,
            labelEl: nameLabelEl,
            polygon: polygon,
            nameLabel: nameLabel,
            bounds: bounds,
          };

          var handler = function (e) {
            if (e.preventMap) e.preventMap();
            if (e.domEvent && e.domEvent.stopPropagation)
              e.domEvent.stopPropagation();
            selectNeighborhood(entry);
          };
          kakao.maps.event.addListener(polygon, "mousedown", handler);
          kakao.maps.event.addListener(polygon, "click", handler);
          kakao.maps.event.addListener(polygon, "mouseover", function () {
            mapContainer.classList.add("poly-hover");
          });
          kakao.maps.event.addListener(polygon, "mouseout", function () {
            mapContainer.classList.remove("poly-hover");
          });
          nameLabelEl.addEventListener("click", function (e) {
            e.stopPropagation();
            selectNeighborhood(entry);
          });

          neighborhoods.push(entry);
        });

        buildStationGroups();
        updateNeighborhoodVisibility();

        // 목록 패널을 데이터 로딩보다 먼저 열었을 때도 자동으로 최신 목록을 채운다.
        if (document.getElementById("neighborhood-list")) {
          openNeighborhoodList();
        }

        // 고유 링크(?n=동네ID)로 접속 시 해당 동네로 이동 + 패널 오픈
        var targetId = new URLSearchParams(location.search).get("n");
        if (targetId) {
          var target = neighborhoods.find(function (n) {
            return n.id === targetId;
          });
          if (target) {
            map.setBounds(target.bounds);
            if (map.getLevel() > NEIGHBORHOOD_ZOOM_THRESHOLD) {
              map.setLevel(NEIGHBORHOOD_ZOOM_THRESHOLD);
            }
            updateNeighborhoodVisibility();
            selectNeighborhood(target);
          }
        }
      }
      loadNeighborhoods();
      loadDevelopmentOverlays();

      kakao.maps.event.addListener(map, "click", function () {
        closeMapGuide();
        closeSiteMenu();
        if (!isPolygonClicked) {
          closeInfoPanel();
          closeSitePanel();
        }
        isPolygonClicked = false;
        document.getElementById("theme-panel").classList.remove("open");
        closeThemeCard();
      });

      // ══════════════ 큐레이션 테마 레이어 ══════════════
      var CATEGORY_EMOJI = {
        밥: "🍚",
        커피: "☕",
        간식: "🍡",
        카페: "☕",
        도서관: "📚",
        열린공간: "🏛️",
        공원: "🌳",
        산책로: "🛣️",
        전망: "🌇",
      };
      var themePins = [];
      var openThemeCollapse = null; // 지금 카드로 펼쳐진 핀을 다시 칩으로 접는 함수

      function closeThemeCard() {
        if (openThemeCollapse) {
          var fn = openThemeCollapse;
          openThemeCollapse = null;
          fn();
        }
      }

      function clearThemePins() {
        closeThemeCard();
        themePins.forEach(function (p) {
          p.setMap(null);
        });
        themePins = [];
      }

      var THEME_LABELS = {
        "": "🧭 테마 지도",
        혼밥: "🍚 혼밥 지도",
        공부: "✏️ 공부 지도",
        산책: "🚶 산책 지도",
      };

      async function selectTheme(theme) {
        closeMapGuide();
        document.getElementById("theme-btn-label").textContent =
          THEME_LABELS[theme];
        document.getElementById("theme-panel").classList.remove("open");
        document
          .getElementById("theme-toggle-btn")
          .classList.toggle("is-active", !!theme);
        clearThemePins();
        if (!theme) return;

        var { data, error } = await sb
          .from("curated_places")
          .select("*")
          .eq("layer", theme);
        if (error) {
          console.error("큐레이션 로딩 실패:", error);
          return;
        }
        data.forEach(function (place) {
          var emoji = CATEGORY_EMOJI[place.category] || "📌";
          var position = new kakao.maps.LatLng(place.lat, place.lng);

          var chipEl = document.createElement("div");
          chipEl.textContent = emoji + " " + place.name;
          chipEl.style.cssText =
            "background:#085e6a; color:white; padding:5px 12px; border-radius:20px; font-size:12.5px; font-weight:bold; white-space:nowrap; cursor:pointer; box-shadow:0 2px 8px rgba(8,94,106,0.4);";

          var pinOverlay = new kakao.maps.CustomOverlay({
            position: position,
            content: chipEl,
            // 역단위로 축소된 상태(showIndividual=false)에서는 처음부터 숨김
            map: map.getLevel() <= NEIGHBORHOOD_ZOOM_THRESHOLD ? map : null,
            yAnchor: 0, // 콘텐츠의 맨 위가 지점에 고정 (칩/카드 높이가 달라도 윗선이 항상 같음)
            zIndex: 50,
          });
          themePins.push(pinOverlay);

          var cardOverlay = null;

          function collapse() {
            if (cardOverlay) {
              cardOverlay.setMap(null);
              cardOverlay = null;
            }
            pinOverlay.setMap(map);
            if (openThemeCollapse === collapse) openThemeCollapse = null;
          }

          function expand() {
            closeThemeCard(); // 다른 핀이 펼쳐져 있으면 먼저 접기
            pinOverlay.setMap(null); // 칩을 감추고 그 자리에 카드가 대신 나타남

            var card = document.createElement("div");
            card.style.cssText =
              "position:relative; background:white; border-radius:12px; padding:14px 15px; width:200px; box-sizing:border-box; box-shadow:0 8px 24px rgba(8,94,106,0.35); font-family:inherit; white-space:normal; overflow-wrap:break-word; word-break:break-word;";

            var titleEl = document.createElement("div");
            titleEl.style.cssText =
              "font-weight:bold; font-size:14px; color:#06474f; margin-bottom:4px; white-space:normal; overflow-wrap:break-word; word-break:break-word;";
            titleEl.textContent = emoji + " " + place.name;
            card.appendChild(titleEl);

            if (place.comment) {
              var commentEl = document.createElement("div");
              commentEl.style.cssText =
                "font-size:12.5px; color:#555; line-height:1.5; margin-bottom:6px; white-space:normal; overflow-wrap:break-word; word-break:break-word;";
              commentEl.textContent = place.comment;
              card.appendChild(commentEl);
            }

            if (place.link) {
              var linkEl = document.createElement("a");
              linkEl.href = place.link;
              linkEl.target = "_blank";
              linkEl.textContent = "카카오맵에서 보기 →";
              linkEl.style.cssText =
                "display:inline-block; font-size:12px; color:#085e6a; font-weight:bold;";
              linkEl.addEventListener("click", function (e2) {
                e2.stopPropagation();
              });
              card.appendChild(linkEl);
            }

            cardOverlay = new kakao.maps.CustomOverlay({
              position: position,
              content: card,
              yAnchor: 0, // 칩과 동일 — 윗선이 칩 있던 자리 그대로 유지
              zIndex: 1000,
              map: map,
            });
            openThemeCollapse = collapse;
          }

          chipEl.addEventListener("click", function (e) {
            e.stopPropagation();
            expand();
          });
        });
      }
    </script>
  </body>
</html>
