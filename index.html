<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>어디살까? 자취하기 좋은 동네!</title>
    <meta
      name="description"
      content="직접 다녀보고 추천하는 자취 동네 지도. 동네를 누르면 교통·시세·분위기까지 한눈에 확인할 수 있습니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="어디살까? 자취하기 좋은 동네!" />
    <meta
      property="og:description"
      content="직접 다녀보고 추천하는 자취 동네"
    />
    <meta
      property="og:image"
      content="https://odilive.github.io/odilive/og-image.png?v=2"
    />
    <meta property="og:url" content="https://odilive.github.io/odilive/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&family=S-Core+Dream:wght@900&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "PyeongChangPeace-Bold";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/PyeongChangPeace-Bold.woff2")
          format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --brand-teal: #085e6a;
        --brand-teal-dark: #06474f;
        --brand-teal-tint: #eaf4f3;
        --ink: #16282b;
        --ink-soft: #4c6467;
        --line: #dbe6e5;
      }

      body {
        margin: 0;
        padding: 12px 20px 20px;
        background-color: #f2f6f6;
        color: var(--ink);
        height: 100vh;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }

      body,
      button,
      input,
      select,
      textarea {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 6px;
        padding: 4px 4px;
        flex-shrink: 0;
      }
      .header-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-wordmark {
        margin: 0;
        font-size: 26px;
        font-family: "PyeongChangPeace-Bold", sans-serif;
        font-weight: 700;
        color: var(--brand-teal);
        letter-spacing: -0.01em;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 1px; /* 나중에 로그인/메뉴 아이콘 들어올 자리 */
      }

      #map-controls {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 10;
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 8px;
      }

      .ctrl-wrap {
        position: relative;
      }

      .ctrl-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: inherit;
        font-size: 13px;
        font-weight: bold;
        padding: 7px 14px;
        border-radius: 20px;
        border: 2px solid var(--brand-teal);
        color: var(--brand-teal-dark);
        background: #fff;
        cursor: pointer;
        box-shadow: 0 2px 10px rgba(8, 94, 106, 0.2);
        transition:
          background 0.15s ease,
          color 0.15s ease,
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .ctrl-btn:hover {
        background: var(--brand-teal-tint);
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(8, 94, 106, 0.3);
      }
      .ctrl-btn.is-active,
      .ctrl-btn.is-active:hover {
        background: var(--brand-teal-dark);
        border-color: var(--brand-teal-dark);
        color: #fff;
        box-shadow:
          0 0 0 2px #fff inset,
          0 4px 14px rgba(8, 94, 106, 0.5);
      }
      .ctrl-caret {
        font-size: 9px;
        opacity: 0.85;
      }

      .ctrl-panel {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        margin-top: 8px;
        background: #fff;
        border-radius: 12px;
        padding: 8px;
        box-shadow: 0 8px 24px rgba(8, 94, 106, 0.25);
        flex-direction: column;
        gap: 3px;
        min-width: 160px;
        z-index: 20;
      }
      .ctrl-panel.open {
        display: flex;
      }
      .ctrl-option {
        font-family: inherit;
        text-align: left;
        padding: 9px 10px;
        border: none;
        background: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .ctrl-option:hover {
        background: var(--brand-teal-tint);
        color: var(--brand-teal-dark);
      }


      #map-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #map {
        width: 100%;
        height: 100%;
        border-radius: 14px;
        border: 1px solid var(--line);
        box-sizing: border-box;
        box-shadow: 0 4px 16px rgba(8, 94, 106, 0.12);
      }
      .poly-hover {
        cursor: pointer !important;
      }

      /* 상세 정보 패널 (PC: 오른쪽 슬라이드, 모바일: 하단 바텀시트) */
      #info-panel {
        position: fixed;
        top: 0;
        right: -400px;
        width: 390px;
        height: 100vh;
        background: white;
        z-index: 9999;
        padding: 32px 28px 20px;
        box-shadow: -5px 0 24px rgba(8, 94, 106, 0.16);
        transition: 0.3s ease-out;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      #info-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      #info-panel.open {
        right: 0;
      }
      #info-panel h3 {
        margin: 0 0 6px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--brand-teal-dark);
      }
      #info-tagline {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--brand-teal);
        margin-bottom: 16px;
      }
      #info-tagline:empty {
        display: none;
      }
      #info-desc {
        margin-bottom: 16px;
      }
      #info-desc .desc-heading {
        font-size: 13px;
        font-weight: 800;
        color: var(--brand-teal-dark);
        margin: 12px 0 3px;
      }
      #info-desc .desc-heading:first-child {
        margin-top: 0;
      }
      #info-desc .desc-line {
        font-size: 14px;
        color: var(--ink-soft);
        line-height: 1.7;
      }
      #info-specs {
        margin-bottom: 16px;
      }
      #info-specs div {
        display: flex;
        gap: 10px;
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 3px;
      }
      #info-specs .spec-label {
        flex-shrink: 0;
        width: 28px;
        font-weight: bold;
        color: var(--brand-teal);
      }
      #info-specs .spec-text {
        color: var(--ink-soft);
      }
      #info-links {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-shrink: 0;
      }
      #info-links:empty {
        display: none;
      }
      #info-links a {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: bold;
        text-decoration: none;
      }
      #info-links a svg {
        flex-shrink: 0;
      }
      #info-links .link-youtube {
        background: #fdeaea;
        color: #c0392b;
      }
      #info-links .link-blog {
        background: #e7f7ee;
        color: #059e4a;
      }
      #info-facts {
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      #info-amenities {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      #info-amenities:empty {
        display: none;
      }
      #info-amenities span {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: bold;
        white-space: nowrap;
      }
      #info-amenities .grade-O {
        background: var(--brand-teal-tint);
        color: var(--brand-teal-dark);
      }
      #info-amenities .grade-half {
        background: #fdf0e3;
        color: #c76a15;
      }
      #info-amenities .grade-X {
        background: #eef1f1;
        color: #8a9a9b;
      }
      #info-facility-summary {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      #info-facility-summary span {
        font-size: 13px;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      #info-panel p {
        white-space: pre-wrap;
        line-height: 1.7;
        color: var(--ink-soft);
        font-size: 14px;
      }
      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #93a5a6;
      }
      .copy-btn {
        position: absolute;
        top: 24px;
        right: 54px;
        background: none;
        border: none;
        font-size: 16px;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        #info-panel {
          top: auto;
          right: 0;
          bottom: -100%;
          width: 100%;
          height: auto;
          max-height: 60vh;
          border-radius: 16px 16px 0 0;
          box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.2);
        }
        #info-panel.open {
          bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-brand">
        <img src="logo.png" alt="어디살까 로고" style="height: 42px; width: auto" />
        <p class="header-wordmark">어디살까</p>
      </div>
      <div class="header-actions"></div>
    </div>

    <div id="map-wrap">
      <div id="map"></div>
      <div id="map-controls">
        <div class="ctrl-wrap">
          <button class="ctrl-btn" id="theme-toggle-btn" onclick="toggleThemePanel()">
            <span id="theme-btn-label">🧭 테마 지도</span>
            <span class="ctrl-caret">▾</span>
          </button>
          <div class="ctrl-panel" id="theme-panel">
            <button class="ctrl-option" onclick="selectTheme('')">
              🧭 테마 없음
            </button>
            <button class="ctrl-option" onclick="selectTheme('혼밥')">
              🍚 혼밥 지도
            </button>
            <button class="ctrl-option" onclick="selectTheme('공부')">
              ✏️ 공부 지도
            </button>
            <button class="ctrl-option" onclick="selectTheme('산책')">
              🚶 산책 지도
            </button>
          </div>
        </div>
        <button class="ctrl-btn" id="brand-toggle-btn" onclick="toggleAllBrands()">
          <span>⭐ 자취 인프라</span>
        </button>
      </div>
    </div>

    <div id="info-panel">
      <button class="close-btn" onclick="closeInfoPanel()">&times;</button>
      <button
        class="copy-btn"
        id="btn-copy-link"
        onclick="copyNeighborhoodLink()"
        title="이 동네 링크 복사"
      >
        🔗
      </button>
      <div id="info-scroll">
        <h3 id="info-name"></h3>
        <div id="info-tagline"></div>
        <div id="info-desc"></div>
        <div id="info-specs"></div>
        <div id="info-facts">
          <div id="info-amenities"></div>
          <div id="info-facility-summary"></div>
        </div>
      </div>
      <div id="info-links"></div>
    </div>

    <script
      type="text/javascript"
      src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4221957d3296d5b1b0a48b671070d6cc&libraries=services"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      var SUPABASE_URL = "https://luibrbeiykqyyeatornq.supabase.co";
      var SUPABASE_KEY = "sb_publishable_GN4Ql4F15uqNfSPgWE1T-A_9d5t0fZm";
      var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      var mapContainer = document.getElementById("map");
      var mapOption = {
        center: new kakao.maps.LatLng(37.53, 126.9785), // 용산공원 일대
        level: 8,
      };
      var map = new kakao.maps.Map(mapContainer, mapOption);
      var ps = new kakao.maps.services.Places();

      var brandData = {
        올리브영: {
          active: false,
          markers: {},
          keywords: ["올리브영 드럭스토어"],
          icon: "olive.png",
        },
        다이소: {
          active: false,
          markers: {},
          keywords: ["다이소 생활용품점"],
          icon: "daiso.png",
        },
        스타벅스: {
          active: false,
          markers: {},
          keywords: ["스타벅스 커피전문점"],
          icon: "starbucks.png",
        },
        대형슈퍼: {
          active: false,
          markers: {},
          keywords: ["대형슈퍼"],
          categories: ["MT1"], // 카카오 공식 '대형마트' 분류 (이마트·홈플러스·롯데마트·코스트코 등)
          icon: "ssm.png",
        },
      };

      var infoWindow = new kakao.maps.InfoWindow({ zIndex: 999 });

      function updateBrandMarkers() {
        var bounds = map.getBounds();

        var brandPriority = {
          대형슈퍼: 100,
          다이소: 90,
          스타벅스: 80,
          올리브영: 70,
        };

        Object.keys(brandData).forEach((brand) => {
          if (!brandData[brand].active) return;

          // 키워드 검색과 카테고리 검색이 같은 결과 처리기를 공유 (place.id 기준으로 중복 방지)
          var handleResults = function (data, status) {
            if (status === kakao.maps.services.Status.OK) {
              data.forEach((place) => {
                var finalIcon = brandData[brand].icon;

                if (!brandData[brand].markers[place.id]) {
                  var imageSize = new kakao.maps.Size(35, 35);
                  var markerImage = new kakao.maps.MarkerImage(finalIcon, imageSize);

                  var marker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(place.y, place.x),
                    image: markerImage,
                    map: map,
                    zIndex: brandPriority[brand] || 10,
                  });

                  if (brand === "대형슈퍼") {
                    var content = `
                      <div style="padding:6px 10px; font-size:12px; font-weight:bold; color:#06474f; white-space:nowrap; text-align:center; font-family:sans-serif;">
                        ${place.place_name}
                      </div>
                    `;
                    kakao.maps.event.addListener(marker, "mouseover", function () {
                      infoWindow.setContent(content);
                      infoWindow.open(map, marker);
                    });
                    kakao.maps.event.addListener(marker, "mouseout", function () {
                      infoWindow.close();
                    });
                  }

                  kakao.maps.event.addListener(marker, "click", function () {
                    if (place.place_url) {
                      window.open(place.place_url, "_blank");
                    }
                  });

                  brandData[brand].markers[place.id] = marker;
                }
              });
            }
          };

          brandData[brand].keywords.forEach((keyword) => {
            ps.keywordSearch(keyword, handleResults, { bounds: bounds });
          });
          (brandData[brand].categories || []).forEach((code) => {
            ps.categorySearch(code, handleResults, { bounds: bounds });
          });
        });
      }

      function toggleBrand(brand) {
        var state = brandData[brand];
        state.active = !state.active;
        Object.values(state.markers).forEach((marker) => {
          marker.setMap(state.active ? map : null);
        });
        if (state.active) updateBrandMarkers();
        updateBrandToggleBtnState();
      }

      // 하나라도 켜져있으면 "자취 인프라" 버튼 자체도 켜진 것으로 표시
      function updateBrandToggleBtnState() {
        var anyActive = Object.keys(brandData).some(function (brand) {
          return brandData[brand].active;
        });
        document
          .getElementById("brand-toggle-btn")
          .classList.toggle("is-active", anyActive);
      }

      // 다이소·올리브영·스벅·대형슈퍼를 "우리가 정한 인프라 세트"로 한 번에 켜고 끔
      function toggleAllBrands() {
        var allActive = Object.keys(brandData).every(function (brand) {
          return brandData[brand].active;
        });
        Object.keys(brandData).forEach(function (brand) {
          if (allActive === brandData[brand].active) toggleBrand(brand);
        });
      }

      function toggleThemePanel() {
        document.getElementById("theme-panel").classList.toggle("open");
      }

      kakao.maps.event.addListener(map, "idle", updateBrandMarkers);
      kakao.maps.event.addListener(map, "zoom_changed", function () {
        updateNeighborhoodVisibility();
      });
      updateBrandMarkers();

      // ── 저장된 동네 불러오기 (읽기 전용) ──
      var isPolygonClicked = false;
      var NEIGHBORHOOD_ZOOM_THRESHOLD = 5; // 이 레벨보다 확대되면(숫자가 작아지면) 폴리곤, 아니면 마커
      var neighborhoods = [];
      var subMarkers = [];

      function clearSubMarkers() {
        subMarkers.forEach(function (marker) {
          marker.setMap(null);
        });
        subMarkers = [];
      }

      // 저장 시점에 DB에 스냅샷된 편의점/약국/빨래방을 이모지로 표출 (API 재호출 없음)
      function renderCachedFacilities(facilities) {
        clearSubMarkers();
        facilities.forEach(function (f) {
          var content = `
            <div style="font-size: 16px; line-height: 1; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3)); cursor: default; user-select: none;">
              ${f.emoji}
            </div>
          `;
          var customOverlay = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(f.lat, f.lng),
            content: content,
            xAnchor: 0.5,
            yAnchor: 0.5,
          });
          customOverlay.setMap(map);
          subMarkers.push(customOverlay);
        });
      }

      // 편·약·빨 세 항목을 0개여도 항상 고정 표시
      var FACILITY_TYPES = [
        { type: "편의점", label: "편의점", emoji: "🏪" },
        { type: "약국", label: "약국", emoji: "💊" },
        { type: "셀프빨래방", label: "빨래방", emoji: "🧺" },
      ];

      function buildFacilitySummary(facilities) {
        return FACILITY_TYPES.map(function (ft) {
          var count = (facilities || []).filter(function (f) {
            return f.type === ft.type;
          }).length;
          return "<span>" + ft.emoji + " " + ft.label + " " + count + "</span>";
        }).join("");
      }

      // 다이소/올리브영/대형슈퍼 ○/△/✕ 칩 (관리자가 직접 판정한 값)
      function buildAmenityChips(amenities) {
        var GRADE_DISPLAY = { O: "○", "△": "△", X: "✕" };
        var GRADE_CLASS = { O: "grade-O", "△": "grade-half", X: "grade-X" };
        var AMENITY_LOGO = {
          다이소: "daiso.png",
          올리브영: "olive.png",
          대형슈퍼: "ssm.png",
        };
        return ["다이소", "올리브영", "대형슈퍼"]
          .filter(function (item) {
            return amenities && amenities[item];
          })
          .map(function (item) {
            var g = amenities[item];
            return (
              '<span class="' +
              GRADE_CLASS[g] +
              '"><img src="' +
              AMENITY_LOGO[item] +
              '" alt="" style="height:15px; width:auto; vertical-align:-3px; margin-right:4px;">' +
              item +
              " " +
              GRADE_DISPLAY[g] +
              "</span>"
            );
          })
          .join("");
      }

      // [소제목] 으로 시작하는 줄을 굵은 소제목으로 렌더링
      function renderDescription(text) {
        function esc(s) {
          return s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }
        return (text || "")
          .split("\n")
          .map(function (line) {
            var m = line.match(/^\[(.+?)\]\s*(.*)$/);
            if (m) {
              return (
                '<div class="desc-heading">' +
                esc(m[1]) +
                "</div>" +
                (m[2] ? '<div class="desc-line">' + esc(m[2]) + "</div>" : "")
              );
            }
            if (line.trim() === "") return "";
            return '<div class="desc-line">' + esc(line) + "</div>";
          })
          .join("");
      }

      var currentRow = null; // 패널에 열려있는 동네 (링크 복사용)

      function copyNeighborhoodLink() {
        if (!currentRow) return;
        var url =
          location.origin + location.pathname + "?n=" + currentRow.id;
        var btn = document.getElementById("btn-copy-link");
        function done() {
          btn.textContent = "✅";
          setTimeout(function () {
            btn.textContent = "🔗";
          }, 1500);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, function () {
            prompt("아래 주소를 복사하세요:", url);
          });
        } else {
          prompt("아래 주소를 복사하세요:", url);
        }
      }

      function openInfoPanel(row) {
        currentRow = row;
        document.getElementById("info-name").textContent = row.name;
        document.getElementById("info-tagline").textContent = row.tagline
          ? "“" + row.tagline + "”"
          : "";
        document.getElementById("info-desc").innerHTML = renderDescription(
          row.description,
        );

        var specs = "";
        if (row.transit)
          specs +=
            '<div><span class="spec-label">교통</span><span class="spec-text">' +
            row.transit +
            "</span></div>";
        if (row.price)
          specs +=
            '<div><span class="spec-label">시세</span><span class="spec-text">' +
            row.price +
            "</span></div>";
        document.getElementById("info-specs").innerHTML = specs;

        document.getElementById("info-amenities").innerHTML =
          buildAmenityChips(row.amenities);
        document.getElementById("info-facility-summary").innerHTML =
          buildFacilitySummary(row.facilities);

        var YT_ICON =
          '<svg width="17" height="17" viewBox="0 0 24 24"><path fill="#FF0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8z"/><path fill="#fff" d="M9.5 15.5v-7l6.3 3.5-6.3 3.5z"/></svg>';
        var NAVER_ICON =
          '<svg width="13" height="13" viewBox="0 0 20 20"><rect width="20" height="20" rx="3" fill="#03C75A"/><path fill="#fff" d="M11.35 10.25 8.5 6.19H5.81v7.62H8.5v-4.06l2.85 4.06h2.69V6.19h-2.69v4.06z"/></svg>';

        var links = "";
        if (row.youtube_url)
          links +=
            '<a class="link-youtube" href="' +
            row.youtube_url +
            '" target="_blank">' +
            YT_ICON +
            " 답사 영상</a>";
        if (row.blog_url)
          links +=
            '<a class="link-blog" href="' +
            row.blog_url +
            '" target="_blank">' +
            NAVER_ICON +
            " 소개글 전문</a>";
        document.getElementById("info-links").innerHTML = links;

        document.getElementById("info-panel").classList.add("open");
        renderCachedFacilities(row.facilities || []);
      }

      var selectedNeighborhood = null; // 지금 폴리곤이 펼쳐져 보이는 동네 (한 번에 하나만)

      var NAME_LABEL_STYLE =
        "background:white; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; color:#06474f; box-shadow:0 2px 6px rgba(8,94,106,0.3); white-space:nowrap; cursor:pointer; border:1.5px solid #085e6a;";
      var NAME_LABEL_STYLE_SELECTED =
        "background:#06474f; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; color:#fff; box-shadow:0 0 0 2px #fff inset, 0 3px 10px rgba(8,94,106,0.5); white-space:nowrap; cursor:pointer; border:1.5px solid #06474f;";

      function closeInfoPanel() {
        clearSubMarkers();
        document.getElementById("info-panel").classList.remove("open");
        if (selectedNeighborhood) {
          selectedNeighborhood.polygon.setMap(null);
          selectedNeighborhood.labelEl.style.cssText = NAME_LABEL_STYLE;
          selectedNeighborhood = null;
        }
      }

      // 이름표를 클릭했을 때: 그 동네만 폴리곤을 펼치고, 이전에 펼쳐져 있던 폴리곤은 접음
      function selectNeighborhood(n) {
        if (selectedNeighborhood && selectedNeighborhood !== n) {
          selectedNeighborhood.polygon.setMap(null);
          selectedNeighborhood.labelEl.style.cssText = NAME_LABEL_STYLE;
        }
        selectedNeighborhood = n;
        n.polygon.setMap(map);
        n.labelEl.style.cssText = NAME_LABEL_STYLE_SELECTED;
        isPolygonClicked = true;
        setTimeout(function () {
          isPolygonClicked = false;
        }, 100);
        openInfoPanel(n.row);
      }

      var stationGroups = [];

      function boundsCenter(b) {
        var sw = b.getSouthWest();
        var ne = b.getNorthEast();
        return new kakao.maps.LatLng(
          (sw.getLat() + ne.getLat()) / 2,
          (sw.getLng() + ne.getLng()) / 2,
        );
      }

      // 현재 줌 레벨에 따라 "이름표들" ↔ "역 단위 그룹 라벨"을 전환 (폴리곤 자체는 선택했을 때만 보임)
      function updateNeighborhoodVisibility() {
        var showIndividual = map.getLevel() <= NEIGHBORHOOD_ZOOM_THRESHOLD;
        neighborhoods.forEach(function (n) {
          n.nameLabel.setMap(showIndividual ? map : null);
        });
        stationGroups.forEach(function (g) {
          g.marker.setMap(showIndividual ? null : map);
        });
        if (!showIndividual) {
          closeInfoPanel(); // 축소되면 선택 해제 + 펼쳐진 폴리곤·이모지·패널 정리
        }
      }

      // 같은 역(row.station) 기준으로 동네들을 묶어서, 축소 상태에서 역당 라벨 하나만 표시
      function buildStationGroups() {
        stationGroups.forEach(function (g) {
          g.marker.setMap(null);
        });
        stationGroups = [];

        var groupsByKey = {};
        neighborhoods.forEach(function (n) {
          var stationName = n.row.station && n.row.station.trim();
          var key = stationName || "__solo__" + n.id; // 역 미입력 동네는 단독 그룹
          if (!groupsByKey[key]) {
            groupsByKey[key] = {
              station: stationName || "",
              members: [],
              bounds: new kakao.maps.LatLngBounds(),
            };
            stationGroups.push(groupsByKey[key]);
          }
          var g = groupsByKey[key];
          g.members.push(n);
          g.bounds.extend(n.bounds.getSouthWest());
          g.bounds.extend(n.bounds.getNorthEast());
        });

        stationGroups.forEach(function (g) {
          var label = g.station
            ? "🚇 " +
              g.station +
              (g.members.length > 1 ? " (" + g.members.length + ")" : "")
            : "🏘️ " + g.members[0].row.name;

          var el = document.createElement("div");
          el.textContent = label;
          el.style.cssText =
            "background:white; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:bold; color:#06474f; box-shadow:0 2px 8px rgba(8,94,106,0.25); white-space:nowrap; cursor:pointer; border:2px solid #085e6a;";
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            isPolygonClicked = true;
            setTimeout(function () {
              isPolygonClicked = false;
            }, 100);
            map.setBounds(g.bounds);
            // 화면 폭에 따라 fit 결과 줌이 달라질 수 있어, 개별 보기 기준보다 축소돼 있으면 강제로 보정
            if (map.getLevel() > NEIGHBORHOOD_ZOOM_THRESHOLD) {
              map.setLevel(NEIGHBORHOOD_ZOOM_THRESHOLD);
            }
            updateNeighborhoodVisibility();
            if (g.members.length === 1) {
              selectNeighborhood(g.members[0]);
            }
          });

          g.marker = new kakao.maps.CustomOverlay({
            position: boundsCenter(g.bounds),
            content: el,
            map: null,
            yAnchor: 0.5,
            zIndex: 25,
          });
        });
      }

      async function loadNeighborhoods() {
        var { data, error } = await sb.from("neighborhoods").select("*");
        if (error) {
          console.error("동네 목록 로딩 실패:", error);
          return;
        }
        data.forEach(function (row) {
          var path = row.polygon.map(function (p) {
            return new kakao.maps.LatLng(p.lat, p.lng);
          });
          var bounds = new kakao.maps.LatLngBounds();
          path.forEach(function (latlng) {
            bounds.extend(latlng);
          });

          var polygon = new kakao.maps.Polygon({
            map: null,
            path: path,
            strokeWeight: 3,
            strokeColor: "#085e6a",
            fillColor: "#085e6a",
            fillOpacity: 0.45,
            zIndex: 10,
            clickable: true,
          });

          // 확대 상태에서 항상 보이는 이름표 (폴리곤 자체는 이걸 눌러야 펼쳐짐)
          var nameLabelEl = document.createElement("div");
          nameLabelEl.textContent = row.name;
          nameLabelEl.style.cssText = NAME_LABEL_STYLE;
          var nameLabel = new kakao.maps.CustomOverlay({
            position: boundsCenter(bounds),
            content: nameLabelEl,
            map: null,
            yAnchor: 1.3,
            zIndex: 20,
          });

          var entry = {
            id: row.id,
            row: row,
            labelEl: nameLabelEl,
            polygon: polygon,
            nameLabel: nameLabel,
            bounds: bounds,
          };

          var handler = function (e) {
            if (e.preventMap) e.preventMap();
            if (e.domEvent && e.domEvent.stopPropagation) e.domEvent.stopPropagation();
            selectNeighborhood(entry);
          };
          kakao.maps.event.addListener(polygon, "mousedown", handler);
          kakao.maps.event.addListener(polygon, "click", handler);
          kakao.maps.event.addListener(polygon, "mouseover", function () {
            mapContainer.classList.add("poly-hover");
          });
          kakao.maps.event.addListener(polygon, "mouseout", function () {
            mapContainer.classList.remove("poly-hover");
          });
          nameLabelEl.addEventListener("click", function (e) {
            e.stopPropagation();
            selectNeighborhood(entry);
          });

          neighborhoods.push(entry);
        });

        buildStationGroups();
        updateNeighborhoodVisibility();

        // 고유 링크(?n=동네ID)로 접속 시 해당 동네로 이동 + 패널 오픈
        var targetId = new URLSearchParams(location.search).get("n");
        if (targetId) {
          var target = neighborhoods.find(function (n) {
            return n.id === targetId;
          });
          if (target) {
            map.setBounds(target.bounds);
            if (map.getLevel() > NEIGHBORHOOD_ZOOM_THRESHOLD) {
              map.setLevel(NEIGHBORHOOD_ZOOM_THRESHOLD);
            }
            updateNeighborhoodVisibility();
            selectNeighborhood(target);
          }
        }
      }
      loadNeighborhoods();

      kakao.maps.event.addListener(map, "click", function () {
        if (!isPolygonClicked) {
          closeInfoPanel();
        }
        isPolygonClicked = false;
        document.getElementById("theme-panel").classList.remove("open");
        closeThemeCard();
      });

      // ══════════════ 큐레이션 테마 레이어 ══════════════
      var CATEGORY_EMOJI = {
        밥: "🍚",
        커피: "☕",
        간식: "🍡",
        카페: "☕",
        도서관: "📚",
        열린공간: "🏛️",
        공원: "🌳",
        산책로: "🛣️",
        전망: "🌇",
      };
      var themePins = [];
      var openThemeCollapse = null; // 지금 카드로 펼쳐진 핀을 다시 칩으로 접는 함수

      function closeThemeCard() {
        if (openThemeCollapse) {
          var fn = openThemeCollapse;
          openThemeCollapse = null;
          fn();
        }
      }

      function clearThemePins() {
        closeThemeCard();
        themePins.forEach(function (p) {
          p.setMap(null);
        });
        themePins = [];
      }

      var THEME_LABELS = {
        "": "🧭 테마 지도",
        혼밥: "🍚 혼밥 지도",
        공부: "✏️ 공부 지도",
        산책: "🚶 산책 지도",
      };

      async function selectTheme(theme) {
        document.getElementById("theme-btn-label").textContent =
          THEME_LABELS[theme];
        document.getElementById("theme-panel").classList.remove("open");
        document
          .getElementById("theme-toggle-btn")
          .classList.toggle("is-active", !!theme);
        clearThemePins();
        if (!theme) return;

        var { data, error } = await sb
          .from("curated_places")
          .select("*")
          .eq("layer", theme);
        if (error) {
          console.error("큐레이션 로딩 실패:", error);
          return;
        }
        data.forEach(function (place) {
          var emoji = CATEGORY_EMOJI[place.category] || "📌";
          var position = new kakao.maps.LatLng(place.lat, place.lng);

          var chipEl = document.createElement("div");
          chipEl.textContent = emoji + " " + place.name;
          chipEl.style.cssText =
            "background:#085e6a; color:white; padding:5px 12px; border-radius:20px; font-size:12.5px; font-weight:bold; white-space:nowrap; cursor:pointer; box-shadow:0 2px 8px rgba(8,94,106,0.4);";

          var pinOverlay = new kakao.maps.CustomOverlay({
            position: position,
            content: chipEl,
            map: map, // 큐레이션 배지는 모든 줌 레벨에서 표시
            yAnchor: 0, // 콘텐츠의 맨 위가 지점에 고정 (칩/카드 높이가 달라도 윗선이 항상 같음)
            zIndex: 50,
          });
          themePins.push(pinOverlay);

          var cardOverlay = null;

          function collapse() {
            if (cardOverlay) {
              cardOverlay.setMap(null);
              cardOverlay = null;
            }
            pinOverlay.setMap(map);
            if (openThemeCollapse === collapse) openThemeCollapse = null;
          }

          function expand() {
            closeThemeCard(); // 다른 핀이 펼쳐져 있으면 먼저 접기
            pinOverlay.setMap(null); // 칩을 감추고 그 자리에 카드가 대신 나타남

            var card = document.createElement("div");
            card.style.cssText =
              "position:relative; background:white; border-radius:12px; padding:14px 15px; width:200px; box-sizing:border-box; box-shadow:0 8px 24px rgba(8,94,106,0.35); font-family:inherit; white-space:normal; overflow-wrap:break-word; word-break:break-word;";

            var titleEl = document.createElement("div");
            titleEl.style.cssText =
              "font-weight:bold; font-size:14px; color:#06474f; margin-bottom:4px; white-space:normal; overflow-wrap:break-word; word-break:break-word;";
            titleEl.textContent = emoji + " " + place.name;
            card.appendChild(titleEl);

            if (place.comment) {
              var commentEl = document.createElement("div");
              commentEl.style.cssText =
                "font-size:12.5px; color:#555; line-height:1.5; margin-bottom:6px; white-space:normal; overflow-wrap:break-word; word-break:break-word;";
              commentEl.textContent = place.comment;
              card.appendChild(commentEl);
            }

            if (place.link) {
              var linkEl = document.createElement("a");
              linkEl.href = place.link;
              linkEl.target = "_blank";
              linkEl.textContent = "카카오맵에서 보기 →";
              linkEl.style.cssText =
                "display:inline-block; font-size:12px; color:#085e6a; font-weight:bold;";
              linkEl.addEventListener("click", function (e2) {
                e2.stopPropagation();
              });
              card.appendChild(linkEl);
            }

            cardOverlay = new kakao.maps.CustomOverlay({
              position: position,
              content: card,
              yAnchor: 0, // 칩과 동일 — 윗선이 칩 있던 자리 그대로 유지
              zIndex: 1000,
              map: map,
            });
            openThemeCollapse = collapse;
          }

          chipEl.addEventListener("click", function (e) {
            e.stopPropagation();
            expand();
          });
        });
      }
    </script>
  </body>
</html>
